name: Build and test Halaa voice room installers
on:
  workflow_dispatch:
  push:
    branches: ['release/android-rooms-*']
    paths:
      - 'halaa-user-app-flutter/halaa_user_flutter/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: voice-release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Build both release installations from the same source
        working-directory: halaa-user-app-flutter/halaa_user_flutter
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.halla --project-name halaa_user_app .
          flutter pub get
          mkdir -p "$GITHUB_WORKSPACE/installers"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/installers/Halaa-App-Android.apk"
          ORG_GRADLE_PROJECT_halaaRoomsSideBySide=true flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/installers/Halaa-Rooms-Android.apk"
      - name: Verify application IDs, release version, microphone permissions and native voice libraries
        working-directory: installers
        run: |
          set -euo pipefail
          b=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          version=$(sed -n 's/^version: //p' ../halaa-user-app-flutter/halaa_user_flutter/pubspec.yaml)
          for file in *.apk; do
            pkg=com.halla.halaa_user_app
            if [[ "$file" == 'Halaa-Rooms-Android.apk' ]]; then pkg="$pkg.rooms"; fi
            "$(dirname "$b")/apksigner" verify "$file"
            "$b" dump badging "$file" > "$RUNNER_TEMP/manifest.txt"
            grep -F "package: name='$pkg' versionCode='${version##*+}' versionName='${version%+*}'" "$RUNNER_TEMP/manifest.txt"
            grep -F "launchable-activity: name='com.halla.halaa_user_app.MainActivity'" "$RUNNER_TEMP/manifest.txt"
            grep -F 'android.permission.RECORD_AUDIO' "$RUNNER_TEMP/manifest.txt"
            unzip -Z1 "$file" | grep -Ei '^lib/arm64-v8a/.*ZegoExpress.*\.so$' > "$RUNNER_TEMP/zego.txt"
            test -s "$RUNNER_TEMP/zego.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-voice-installers
          path: installers/*.apk
  verify-room:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: android-voice-installers
      - name: Prepare the legacy APK and hardware acceleration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p legacy
          gh release download latest --pattern 'Halaa-App-Android.apk' --dir legacy
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 -m pip install uiautomator2==3.7.1
      - name: Check startup, coexistence, and the user interface after tapping a room
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install Halaa-App-Android.apk
            adb shell am start -W -n com.halla.halaa_user_app/.MainActivity
            sleep 8
            adb shell pidof com.halla.halaa_user_app || (adb logcat -b crash -d -t 100 && false)
            adb uninstall com.halla.halaa_user_app
            adb install legacy/Halaa-App-Android.apk
            adb install Halaa-Rooms-Android.apk
            adb shell pm path com.halla.halaa_user_app
            adb shell pm path com.halla.halaa_user_app.rooms
            adb shell wm size 1080x2200
            adb shell wm density 360
            adb shell am start -W -n com.halla.halaa_user_app.rooms/com.halla.halaa_user_app.MainActivity
            sleep 8
            adb shell pidof com.halla.halaa_user_app.rooms || (adb logcat -b crash -d -t 100 && false)
            python3 .github/scripts/check_room_entry.py
