name: Review ZEGO integration (no publishing)
on:
  pull_request:
    branches: [main]
    paths:
      - 'halaa-user-app-flutter/**'
      - 'halaa-admin-app-flutter/**'
      - 'server/**'
      - '.github/workflows/review-zego.yml'
concurrency:
  group: mobile-compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  flutter-review:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [user, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Analyze and build review artifacts
        shell: bash
        working-directory: halaa-${{ matrix.app }}-app-flutter/halaa_${{ matrix.app }}_flutter
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.halla --project-name halaa_${{ matrix.app }}_app .; rm -f test/widget_test.dart; fi
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build web --release
          for delay in 0 45 120; do
            sleep "$delay"
            log="$RUNNER_TEMP/android-${{ matrix.app }}.log"
            if flutter build apk --debug 2>&1 | tee "$log"; then exit 0; fi
            grep -Eq '429|Too Many Requests' "$log" || exit 1
          done
          exit 1
      - name: Enable Android emulator acceleration
        if: matrix.app == 'user'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch user app on Android emulator
        if: matrix.app == 'user'
        timeout-minutes: 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: halaa-user-app-flutter/halaa_user_flutter
          script: |
            adb install build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -W -n com.halla.halaa_user_app/.MainActivity
            sleep 8
            adb shell pidof com.halla.halaa_user_app || (adb logcat -b crash -d -t 100 && false)
      - uses: actions/upload-artifact@v4
        with:
          name: halaa-${{ matrix.app }}-review
          path: |
            halaa-${{ matrix.app }}-app-flutter/halaa_${{ matrix.app }}_flutter/build/app/outputs/flutter-apk/app-debug.apk
            halaa-${{ matrix.app }}-app-flutter/halaa_${{ matrix.app }}_flutter/build/web
  ios-review:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Compile unsigned iOS review build
        working-directory: halaa-user-app-flutter/halaa_user_flutter
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
      - name: Launch user app on iPhone simulator
        working-directory: halaa-user-app-flutter/halaa_user_flutter
        timeout-minutes: 20
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid" || xcrun simctl bootstatus "$udid" -b
          flutter build ios --simulator --debug
          xcrun simctl bootstatus "$udid" -b
          app=build/ios/iphonesimulator/Runner.app
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" "$bundle"
          sleep 8
          xcrun simctl spawn "$udid" launchctl list | awk -v bundle="$bundle" 'index($3,bundle) && $1 ~ /^[0-9]+$/ { found=1 } END { exit !found }'
