name: Build Halla Flutter
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['studio/**', '.github/workflows/flutter.yml']
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - working-directory: studio
        run: |
          flutter pub get
          flutter build web --release --base-href /Halla/halla-web/studio/
      - name: Publish compiled interface
        run: |
          if [ ! -f halla-web/app.html ]; then cp halla-web/index.html halla-web/app.html; fi
          mkdir -p halla-web/studio
          cp -a studio/build/web/. halla-web/studio/
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add halla-web
          git diff --cached --quiet || git commit -m 'Publish built Flutter Web interface'
          git push
