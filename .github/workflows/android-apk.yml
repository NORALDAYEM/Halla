name: Android APK (private phone testing)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
      - name: Generate Android project
        run: flutter create --platforms=android --project-name halaa .
      - name: Remove generated sample test referencing a different app
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Check Dart syntax and diagnostics
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build user APK
        run: flutter build apk --debug -t lib/main.dart
      - name: Save user APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk Halaa-User-debug.apk
      - name: Set separate admin application ID
        run: |
          sed -i 's/com.example.halaa/com.example.halaa.admin/g' android/app/build.gradle.kts
      - name: Build admin APK
        run: flutter build apk --debug -t lib/admin_main.dart
      - name: Save admin APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk Halaa-Admin-debug.apk
      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: Halaa-Private-Phone-APKs
          path: |
            Halaa-User-debug.apk
            Halaa-Admin-debug.apk
          if-no-files-found: error
          retention-days: 14
