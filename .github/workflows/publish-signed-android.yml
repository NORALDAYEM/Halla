name: Sign and publish Android voice rooms
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Android voice installer workflow run for this app source
        required: true
        type: string
  push:
    branches: [release/android-rooms-3.1.6]
    paths: ['.github/workflows/publish-signed-android.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: halaa-production-android-release
  cancel-in-progress: false
env:
  BUILD_RUN: ${{ inputs.build_run || '45846980882' }}
jobs:
  sign:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/android-rooms-3.1.6'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Match build provenance and wait for both installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          repo="$GITHUB_REPOSITORY"
          api="repos/$repo/actions/runs/$BUILD_RUN"
          gh api "$api" > "$RUNNER_TEMP/source.json"
          jq -e --arg repo "$repo" '.name=="Build and test Halaa voice room installers" and .head_repository.full_name==$repo and (.event=="push" or .event=="workflow_dispatch")' "$RUNNER_TEMP/source.json" >/dev/null
          source=$(jq -r .head_sha "$RUNNER_TEMP/source.json")
          git fetch --quiet --depth=1 origin "$source"
          tree=halaa-user-app-flutter/halaa_user_flutter
          test "$(git rev-parse "$source:$tree")" = "$(git rev-parse "HEAD:$tree")"
          for attempt in $(seq 1 120); do
            state=$(gh api "$api/jobs" --jq '.jobs[] | select(.name=="build") | (.conclusion // .status)')
            case "$state" in success) break ;; completed|failure|cancelled|skipped|timed_out) exit 1 ;; esac
            sleep 15
          done
          test "$state" = success
          gh run download "$BUILD_RUN" --repo "$repo" --name android-voice-installers --dir candidates
      - name: Sign both verified payloads using the restored production key
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDRIVE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDRIVE_SECRET_KEY }}
          IDRIVE_ENDPOINT: ${{ secrets.IDRIVE_ENDPOINT || 'https://s3.us-west-4.idrivee2.com' }}
          IDRIVE_BUCKET: ${{ secrets.IDRIVE_BUCKET || 'halla' }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          HALAA_ANDROID_STORE_PASSWORD: ${{ secrets.HALAA_ANDROID_STORE_PASSWORD }}
        run: |
          python3 .github/scripts/android_signer.py sign --fingerprint "$(cat .github/android-release-cert.sha256)" --source candidates --destination signed
      - name: Read release version
        id: version
        run: |
          version=$(sed -n 's/^version: //p' halaa-user-app-flutter/halaa_user_flutter/pubspec.yaml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          echo "tag=android-${version/+/-}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-android-installers
          path: signed/*.apk
  publish:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.sign.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-android-installers
      - name: Require successful installation and room navigation
        run: |
          set -euo pipefail
          for attempt in $(seq 1 65); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs" --jq '.jobs[] | select(.name=="verify-room") | (.conclusion // .status)')
            case "$state" in success) break ;; completed|failure|cancelled|skipped|timed_out) exit 1 ;; esac
            sleep 12
          done
          test "$state" = success
      - name: Publish immutable APKs and verify the public download bytes
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if ! gh release view "$TAG" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$TAG" Halaa-App-Android.apk Halaa-Rooms-Android.apk --repo "$repo" --target "$GITHUB_SHA" --latest --title "غرف هلا الصوتية · ${TAG#android-}" --notes 'عند وجود نسخة قديمة، نزّل Halaa-Rooms-Android.apk ثم افتح «هلا الغرف» وسجّل الدخول بحسابك. للتثبيت لأول مرة نزّل Halaa-App-Android.apk.'
          fi
          mkdir downloaded
          for file in Halaa-App-Android.apk Halaa-Rooms-Android.apk; do
            curl --retry 3 --fail --location --silent --show-error "https://github.com/$repo/releases/download/$TAG/$file" -o "downloaded/$file"
            cmp "$file" "downloaded/$file"
            sha256sum "$file"
          done
