name: Room search Android preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - '.github/workflows/room-search-preview.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          if [ ! -f android/gradlew ]; then
            flutter create --no-pub --platforms=android --project-name halaa "$RUNNER_TEMP/halaa"
            cp -rn "$RUNNER_TEMP/halaa/android" .
          fi
          flutter pub get
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Halaa-Android-preview
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - run: flutter test test/room_search_test.dart
