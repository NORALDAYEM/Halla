name: Build Halaa Apps (Web + Android APK + iPhone IPA)

on:
  push:
    branches:
      - main
    paths:
      - 'halaa-user-app-flutter/halaa_user_flutter/**'
      - 'halaa-admin-app-flutter/halaa_admin_flutter/**'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: build-halaa-all-platforms-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build-web-and-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (for Android APK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Halaa User App (Web + Android APK)
        working-directory: halaa-user-app-flutter/halaa_user_flutter
        run: |
          flutter create --platforms=android --org com.halla --project-name halaa_user_app .
            flutter pub get
          flutter build web --release --base-href "/Halla/halla-web/"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../Halaa-App-Android.apk

      - name: Build Halaa Admin App (Web + Android APK)
        working-directory: halaa-admin-app-flutter/halaa_admin_flutter
        run: |
          flutter create --platforms=android --org com.halla --project-name halaa_admin_app .
          flutter pub get
          flutter build web --release --base-href "/Halla/admin/"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../Halaa-Admin-Android.apk

      - name: Upload Android APK Installers (App & Admin)
        uses: actions/upload-artifact@v4
        with:
          name: Halaa-Android-APKs
          path: |
            Halaa-App-Android.apk
            Halaa-Admin-Android.apk
      - name: Publish Public APK Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest || gh release create latest --title "Halaa Latest APKs" --notes "Automatic build release"
          gh release upload latest Halaa-App-Android.apk Halaa-Admin-Android.apk --clobber
      - name: Deploy Separate Web Builds to halla-web/ and admin/
        run: |
          rm -rf /tmp/halla-web-build /tmp/admin-web-build
          mkdir -p /tmp/halla-web-build /tmp/admin-web-build
          cp -r halaa-user-app-flutter/halaa_user_flutter/build/web/. /tmp/halla-web-build/
          cp -r halaa-admin-app-flutter/halaa_admin_flutter/build/web/. /tmp/admin-web-build/
          git fetch origin main
          git reset --hard origin/main
          python3 -c "import json,re,os; rv=lambda p: (lambda m: (m.group(1), int(m.group(2) or 1)) if m else None)(re.search(r'^version:\s*([^\s+#]+)(?:\+(\d+))?', open(p).read(), re.M)); d=json.load(open('app_version.json')); u=rv('halaa-user-app-flutter/halaa_user_flutter/pubspec.yaml'); a=rv('halaa-admin-app-flutter/halaa_admin_flutter/pubspec.yaml'); base=os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/releases/download/latest/'; u and d['user_app'].update({'latest_version':u[0],'latest_build':u[1],'min_required_build':u[1],'download_url':base+'Halaa-App-Android.apk'}); a and d['admin_app'].update({'latest_version':a[0],'latest_build':a[1],'min_required_build':a[1],'download_url':base+'Halaa-Admin-Android.apk'}); open('app_version.json','w').write(json.dumps(d,indent=2,ensure_ascii=False)+'\n')"
          rm -rf halla-web/* admin/*
          mkdir -p halla-web admin
          cp -r /tmp/halla-web-build/. halla-web/
          cp -r /tmp/admin-web-build/. admin/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add halla-web/ admin/ app_version.json
          if ! git diff --cached --quiet; then
            git commit -m "Deploy separate Halaa User & Admin Flutter Web apps"
           git pull --rebase -X theirs origin main || true
            git push origin main
          fi

  build-iphone-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Halaa User App (iPhone unsigned IPA)
        working-directory: halaa-user-app-flutter/halaa_user_flutter
        run: |
          flutter create --platforms=ios --org com.halla --project-name halaa_user_app .
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ../../Halaa-App-iPhone-unsigned.ipa Payload
          rm -rf Payload

      - name: Build Halaa Admin App (iPhone unsigned IPA)
        working-directory: halaa-admin-app-flutter/halaa_admin_flutter
        run: |
          flutter create --platforms=ios --org com.halla --project-name halaa_admin_app .
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ../../Halaa-Admin-iPhone-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iPhone IPA Installers (App & Admin)
        uses: actions/upload-artifact@v4
        with:
          name: Halaa-iPhone-IPAs
          path: |
            Halaa-App-iPhone-unsigned.ipa
            Halaa-Admin-iPhone-unsigned.ipa
