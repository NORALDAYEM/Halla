name: Build & Deploy Full Halaa Flutter (App + Admin)

on:
  push:
    branches:
      - main
    paths:
      - 'halaa-complete-flutter/halaa_flutter/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-flutter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter packages
        working-directory: halaa-complete-flutter/halaa_flutter
        run: flutter pub get

      - name: Build Halaa App (Web) for /Halla/halla-web/
        working-directory: halaa-complete-flutter/halaa_flutter
        run: flutter build web --release --base-href "/Halla/halla-web/" --dart-define=ENTRY=app

      - name: Copy Halaa App build while preserving welcome-gallery assets
        run: |
          mkdir -p /tmp/preserved_assets
          if [ -d halla-web/assets ]; then
            cp -r halla-web/assets /tmp/preserved_assets/
          fi
          rm -rf halla-web/*
          cp -r halaa-complete-flutter/halaa_flutter/build/web/* halla-web/
          if [ -d /tmp/preserved_assets/assets ]; then
            mkdir -p halla-web/assets
            cp -rn /tmp/preserved_assets/assets/* halla-web/assets/ || true
          fi

      - name: Build Halaa Admin (Web) for /Halla/admin/
        working-directory: halaa-complete-flutter/halaa_flutter
        run: flutter build web --release --base-href "/Halla/admin/" --dart-define=ENTRY=admin

      - name: Publish Admin Web build into admin/
        run: |
          rm -rf admin/*
          cp -r halaa-complete-flutter/halaa_flutter/build/web/* admin/

      - name: Commit & Push built Flutter Web outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add halla-web/ admin/
          if ! git diff --cached --quiet; then
            git commit -m "Deploy unified Halaa Flutter Web (App + Admin)"
            git push
          else
            echo "No build changes detected."
          fi
