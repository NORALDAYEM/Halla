name: Diagnose Android release startup
on:
  push:
    branches: [release/android-voice-3.1.5]
    paths: ['.github/workflows/verify-room-startup.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-user
          run-id: 45844665174
          github-token: ${{ github.token }}
      - name: Inspect binaries shipped for phones and emulator
        run: |
          unzip -Z1 Halaa-App-Android.apk | grep -E '^lib/(arm64-v8a|x86_64)/' | sort
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Retain a crash trace if Flutter exits on the emulator
        run: |
          cat > "$RUNNER_TEMP/check-process" <<'SH'
          #!/usr/bin/env bash
          if ! adb shell pidof "$1"; then
            adb logcat -b crash -d -t 300
            adb logcat -d -s flutter:E AndroidRuntime:E DEBUG:E linker:E | tail -150
            exit 1
          fi
          SH
          chmod +x "$RUNNER_TEMP/check-process"
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install Halaa-App-Android.apk
            adb logcat -c
            adb shell am start -W -n com.halla.halaa_user_app/.MainActivity
            sleep 10
            "$RUNNER_TEMP/check-process" com.halla.halaa_user_app
