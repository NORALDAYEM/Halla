<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>غرفة هلا الصوتية | ZEGOCLOUD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #071b21; color: #f8fafc; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #0b2c36; border-bottom: 1px solid rgba(0,212,255,0.22); }
    .topbar h1 { font-size: 15px; color: #00d4ff; }
    .badge { font-size: 11px; background: rgba(17,139,151,0.3); border: 1px solid #118b97; padding: 3px 9px; border-radius: 999px; }
    #root { flex: 1; width: 100%; position: relative; }
    .setup-box { max-width: 440px; margin: 32px auto; background: #0d2b35; border: 1px solid rgba(0,212,255,0.25); border-radius: 16px; padding: 20px; }
    .setup-box h2 { font-size: 16px; margin-bottom: 8px; color: #00d4ff; }
    .setup-box p { font-size: 13px; color: #cbd5e1; line-height: 1.6; margin-bottom: 12px; }
    .setup-box input, .setup-box textarea { width: 100%; background: #06171d; color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 13px; }
    .setup-box button { width: 100%; background: #118b97; color: #fff; border: none; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .setup-box button:hover { background: #0e747e; }
    .err { color: #fca5a5; font-size: 12.5px; margin-top: 8px; }
  </style>
  <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
</head>
<body>
  <div class="topbar">
    <h1 id="roomTitle">غرفة هلا الصوتية</h1>
    <span class="badge" id="metaBadge">AppID: 400719759</span>
  </div>
  <div id="root"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const appID = Number(params.get('appID') || 400719759);
    const roomID = params.get('roomID') || 'halaa_main_room';
    const userID = params.get('userID') || ('halaa_' + Math.floor(10000 + Math.random() * 90000));
    const userName = params.get('userName') || 'عضو هلا';
    const roleParam = (params.get('role') || 'Host').toLowerCase();
    const tokenEndpoint = params.get('tokenEndpoint') || ''; const LS_ENDPOINT_KEY = 'halaa_zego_server_endpoint'; const LS_TEMP_TOKEN_KEY = 'halaa_zego_temp_token'; const urlEndpoint = (params.get('serverEndpoint') || tokenEndpoint || '').trim(); if (urlEndpoint) localStorage.setItem(LS_ENDPOINT_KEY, urlEndpoint); let serverEndpoint = (urlEndpoint || localStorage.getItem(LS_ENDPOINT_KEY) || '').trim();
    const urlToken = params.get('token') || '';
    const title = params.get('title') || ('غرفة هلا: ' + roomID);

    document.getElementById('roomTitle').textContent = title;
    document.getElementById('metaBadge').textContent = 'AppID: ' + appID + ' • ' + roomID;

    async function joinWithToken(token) {
      const root = document.getElementById('root');
      root.innerHTML = '';
      const kitToken = ZegoUIKitPrebuilt.generateKitTokenForProduction(
        appID, token.trim(), roomID, userID, userName
      );
      const role = roleParam === 'audience'
        ? ZegoUIKitPrebuilt.Audience
        : ZegoUIKitPrebuilt.Host;
      const zp = ZegoUIKitPrebuilt.create(kitToken);
      zp.joinRoom({
        container: root,
        scenario: { mode: ZegoUIKitPrebuilt.LiveStreaming, config: { role } },
        turnOnCameraWhenJoining: false,
        showMyCameraToggleButton: false,
        showScreenSharingButton: false,
        turnOnMicrophoneWhenJoining: role === ZegoUIKitPrebuilt.Host,
        showTextChat: true,
        showUserList: true,
        showPreJoinView: true
      });
    }
function normalizeEndpoint(raw) { const ep = (raw || '').trim(); if (!ep) return ''; if (ep.includes('/api/zego-token') || ep.includes('?')) return ep; return ep.replace(/\/+$/, '') + '/api/zego-token'; } async function fetchTokenFromEndpoint(endpoint) { const url = normalizeEndpoint(endpoint); if (!url) return null; const headers = { 'Content-Type': 'application/json' }; const authToken = params.get('authToken') || localStorage.getItem('halaa_auth_token') || ''; if (authToken) headers['Authorization'] = 'Bearer ' + authToken; try { const postRes = await fetch(url, { method: 'POST', headers, body: JSON.stringify({ roomID, userID, userName, role: roleParam }) }); if (postRes.ok) { const data = await postRes.json(); if (data && data.token) return data; } } catch (e) {} try { const sep = url.includes('?') ? '&' : '?'; const u = url + sep + 'roomID=' + encodeURIComponent(roomID) + '&userID=' + encodeURIComponent(userID) + '&userName=' + encodeURIComponent(userName) + '&role=' + encodeURIComponent(roleParam); const getRes = await fetch(u, { headers: authToken ? { 'Authorization': 'Bearer ' + authToken } : {} }); if (getRes.ok) { const data = await getRes.json(); if (data && data.token) return data; } } catch (e) {} return null; }
    function showTokenPrompt(errMsg) {
      const saved = localStorage.getItem('halaa_zego_temp_token') || ''; const savedEndpoint = localStorage.getItem(LS_ENDPOINT_KEY) || '';
      document.getElementById('root').innerHTML = `
        <div class="setup-box">
          <h2>تفعيل الاتصال الصوتي (ZEGOCLOUD)</h2>
          <p>الصق <b>الرمز المؤقت (Token)</b> من لوحة تحكم ZEGOCLOUD (أدوات التطوير ← أدوات الرموز المميزة) للدخول الفوري إلى الغرفة <b>${roomID}</b> باسم <b>${userName}</b>.</p>
          <label for="endpointInput" style="display:block;font-size:12.5px;color:#cbd5e1;margin-bottom:6px;">رابط خادم هلا (serverEndpoint - اختياري للعمل الدائم):</label><input id="endpointInput" type="url" placeholder="https://your-server.com أو .../api/zego-token" value="${savedEndpoint.replace(/"/g, '&quot;')}" style="width:100%;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:10px;font-size:13px;margin-bottom:10px;" /><textarea id="tokInput" rows="3" placeholder="الصق التوكن هنا...">${saved}</textarea>
          <button id="joinBtn">دخول الغرفة الصوتية الآن</button>
          ${errMsg ? '<div class="err">' + errMsg + '</div>' : ''}
        </div>
      `;
      document.getElementById('joinBtn').onclick = async () => {
        const val = document.getElementById('tokInput').value.trim(); const epVal = document.getElementById('endpointInput').value.trim(); if (epVal) { localStorage.setItem(LS_ENDPOINT_KEY, epVal); serverEndpoint = epVal; const data = await fetchTokenFromEndpoint(epVal); if (data && data.token) { joinWithToken(data.token); return; } if (!val) { showTokenPrompt('تعذر الاتصال بخادم التوكن، تحقق من الرابط أو أدخل رمزاً مؤقتاً.'); return; } } else { localStorage.removeItem(LS_ENDPOINT_KEY); serverEndpoint = ''; }
        if (!val) return;
        localStorage.setItem('halaa_zego_temp_token', val);
        joinWithToken(val);
      };
    }

    (async function boot() {
      if (urlToken) return joinWithToken(urlToken); if (serverEndpoint) { const data = await fetchTokenFromEndpoint(serverEndpoint); if (data && data.token) return joinWithToken(data.token); }
      if (tokenEndpoint) {
        try {
          const u = tokenEndpoint + '?roomId=' + encodeURIComponent(roomID) + '&userId=' + encodeURIComponent(userID);
          const res = await fetch(u);
          if (res.ok) {
            const data = await res.json();
            if (data && data.token) return joinWithToken(data.token);
          }
        } catch (e) {}
      }
      const saved = localStorage.getItem('halaa_zego_temp_token');
      if (saved) return joinWithToken(saved);
      showTokenPrompt('');
    })();
  </script>
</body>
</html>
