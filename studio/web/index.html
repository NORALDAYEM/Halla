<!doctype html>

<title>هلاا | ألعاب ودردشة</title>
<style>
*{box-sizing:border-box}html{min-height:100%;background:#e7f8f6}body{margin:0;font:16px/1.5 system-ui,sans-serif;color:#1a4250}main{position:relative;max-width:540px;min-height:100vh;min-height:100svh;margin:auto;background:white;display:flex;flex-direction:column}.hero{position:relative;display:grid;place-items:center;min-height:280px;height:48svh;padding:34px 0 12px;background:linear-gradient(#c1f8ee,#f6fffe)}.logo{width:auto;height:min(36svh,274px);max-width:65%;object-fit:contain;mask-image:linear-gradient(to right,transparent,#000 10%,#000 90%,transparent),linear-gradient(to bottom,transparent,#000 5%,#000 95%,transparent);mask-composite:intersect}.guest{position:absolute;z-index:1;top:max(12px,env(safe-area-inset-top));left:14px;background:#ffdc44;border-radius:25px;padding:7px 16px;color:#352c0c;font-size:14px}a{color:inherit;text-decoration:none}button,a{touch-action:manipulation}button{cursor:pointer;font:inherit;border:0;color:inherit}.actions{width:min(82%,360px);margin:auto;padding:clamp(22px,5svh,48px) 0 max(18px,env(safe-area-inset-bottom));text-align:center}.provider{position:relative;display:block;width:100%;border-radius:999px;min-height:51px;margin:0 auto 18px;box-shadow:0 5px 13px #25798824,inset 0 1px 6px #ffffff7a;background:linear-gradient(105deg,#9ad9e7,#73b4ef);color:#183f59;font-size:17px}.provider.fb{background:linear-gradient(105deg,#def3ef,#abe0ed)}.brand{position:absolute;right:17px;top:50%;transform:translateY(-50%);font:bold 26px Arial;color:#377ec6}.fb .brand{border-radius:50%;width:24px;height:24px;color:white;background:#4286ce;font-size:24px;line-height:28px}.or{display:flex;align-items:center;gap:12px;justify-content:center;color:#6a858a;margin:18px 0 12px;font-size:13px}.or:before,.or:after{content:'';height:1px;width:54px;background:#deeaeb}.options{display:flex;justify-content:center;gap:clamp(10px,5vw,32px)}.options a{display:grid;justify-items:center;gap:4px;font-size:12px;min-width:48px}.options b{border-radius:50%;display:grid;place-items:center;width:42px;height:42px;background:#dcf4ef;color:#337e80;font-size:23px;box-shadow:0 4px 10px #357d8122}.options svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.options a:nth-child(2) b{color:#ab7722}.account{display:inline-block;margin-top:18px;color:#28636e;text-decoration:underline;font-size:14px}dialog{border:0;border-radius:20px;max-width:min(90vw,360px);padding:22px;color:#183e46}dialog::backdrop{background:#12383c66}dialog a,dialog button{display:inline-block;padding:10px;border-radius:12px;background:#def4ef}
</style></head>
<body><main><section class="hero" aria-label="هلاا"><a class="guest" href="../member.html?view=guest">وضع الضيف</a><img class="logo" src="../assets/halaa-welcome.webp" alt="هلاا، ألعاب ودردشة" fetchpriority="high"></section>
<section class="actions" aria-label="طرق الدخول">
<button class="provider" data-provider="Google"><b class="brand" aria-hidden="true">G</b>جوجل</button>
<button class="provider fb" data-provider="Facebook"><b class="brand" aria-hidden="true">f</b>Facebook</button>
<div class="or">أو</div><div class="options">
<a href="../member.html?view=phone"><b><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 18h4"/></svg></b>الهاتف</a>
<a href="../member.html?view=login"><b><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/></svg></b>البريد</a>
<a href="../member.html?view=username"><b><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></b>اسم المستخدم</a></div>
<a class="account" href="../member.html?view=signup">إنشاء حساب جديد</a></section></main>
<dialog id="social"><p></p><a href="../member.html?view=login">المتابعة بالبريد</a> <button type="button">إغلاق</button></dialog>
<script>const social=document.querySelector('#social');for(const button of document.querySelectorAll('[data-provider]'))button.onclick=()=>{social.querySelector('p').textContent='الدخول عبر '+button.dataset.provider+' غير مفعّل حاليًا.';social.showModal()};social.querySelector('button').onclick=()=>social.close();</script></body></html>
