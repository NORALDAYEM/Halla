<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هلاا — غرف الدردشة الصوتية والألعاب</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #04080a;
      --bg-surface: #091318;
      --bg-card: #0f1e25;
      --bg-card-hover: #152932;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10d8be;
      --accent-dark: #059684;
      --gold: #f6cb5c;
      --border-subtle: rgba(246, 203, 92, 0.24);
    }
    [data-theme="dark-gold"] {
      --bg-app: #070709;
      --bg-surface: #101014;
      --bg-card: #18181f;
      --bg-card-hover: #22222c;
      --text-main: #faf8f5;
      --text-muted: #a8a29e;
      --accent: #f6cb5c;
      --accent-dark: #ca8a04;
      --gold: #fde047;
      --border-subtle: rgba(246, 203, 92, 0.28);
    }
    [data-theme="cyber-night"] {
      --bg-app: #060714;
      --bg-surface: #0d1026;
      --bg-card: #151a3a;
      --bg-card-hover: #1e2550;
      --text-main: #f8fafc;
      --text-muted: #a5b4fc;
      --accent: #38bdf8;
      --accent-dark: #6366f1;
      --gold: #f5c451;
      --border-subtle: rgba(56, 189, 248, 0.25);
    }
    [data-theme="royal-pearl"] {
      --bg-app: #f4f1ea;
      --bg-surface: #fffdf9;
      --bg-card: #f8f4ec;
      --bg-card-hover: #efe8d8;
      --text-main: #1c1917;
      --text-muted: #57534e;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --gold: #b45309;
      --border-subtle: rgba(180, 83, 9, 0.22);
    }

    body {
      font-family: 'Cairo', 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .theme-surface { background-color: rgba(9, 19, 24, 0.72); backdrop-filter: blur(14px); border-color: var(--border-subtle); }
    @keyframes luxuryBgDrift {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.08) translate(-1.5%, -1%); }
      100% { transform: scale(1) translate(0, 0); }
    }
    .luxury-bg-motion { animation: luxuryBgDrift 22s ease-in-out infinite; }
    .theme-card { background-color: rgba(15, 30, 37, 0.62); backdrop-filter: blur(10px); border-color: var(--border-subtle); }
    .theme-card:hover { background-color: rgba(21, 41, 50, 0.78); }
    .theme-muted { color: var(--text-muted); }
    .theme-accent-bg { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #061316; }
    .theme-accent-text { color: var(--accent); }
    .theme-gold-text { color: var(--gold); }

    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 212, 184, 0.65); }
      70% { box-shadow: 0 0 0 10px rgba(0, 212, 184, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 212, 184, 0); }
    }
    .mic-speaking {
      box-shadow: 0 0 0 2px var(--accent);
      border-color: var(--accent) !important;
    }

    @keyframes giftFloat {
      0% { transform: translateY(20px) scale(0.8); opacity: 0; }
      15% { transform: translateY(0) scale(1.05); opacity: 1; }
      85% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-20px) scale(0.95); opacity: 0; }
    }
    @keyframes luxuryGiftStage {
      0% { transform: scale(0.4) translateY(30px); opacity: 0; }
      20% { transform: scale(1.12) translateY(0); opacity: 1; }
      75% { transform: scale(1) translateY(-4px); opacity: 1; }
      100% { transform: scale(0.9) translateY(-24px); opacity: 0; }
    }
    .luxury-gift-stage {
      animation: luxuryGiftStage 3.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes gift4DSpin {
      0% { transform: perspective(900px) rotateY(-180deg) scale(0.3); opacity: 0; }
      25% { transform: perspective(900px) rotateY(15deg) scale(1.22); opacity: 1; }
      65% { transform: perspective(900px) rotateY(-8deg) scale(1.1); opacity: 1; }
      100% { transform: perspective(900px) rotateY(360deg) scale(0.85); opacity: 0; }
    }
    @keyframes shockwave4D {
      0% { transform: scale(0.4); opacity: 0.9; }
      100% { transform: scale(2.8); opacity: 0; }
    }
    @keyframes gift3DSmooth {
      0% { transform: perspective(900px) rotateY(-45deg) scale(0.5); opacity: 0; }
      20% { transform: perspective(900px) rotateY(15deg) scale(1.08); opacity: 1; }
      55% { transform: perspective(900px) rotateY(-12deg) scale(1.04); opacity: 1; }
      100% { transform: perspective(900px) rotateY(25deg) scale(0.92); opacity: 0; }
    }
    @keyframes gift4DUltra {
      0% { transform: perspective(1000px) rotateY(-180deg) rotateX(15deg) scale(0.35); opacity: 0; }
      20% { transform: perspective(1000px) rotateY(20deg) rotateX(-5deg) scale(1.15); opacity: 1; }
      55% { transform: perspective(1000px) rotateY(-18deg) rotateX(5deg) scale(1.08); opacity: 1; }
      85% { transform: perspective(1000px) rotateY(10deg) scale(1.02); opacity: 1; }
      100% { transform: perspective(1000px) rotateY(360deg) scale(0.85); opacity: 0; }
    }
    .gift-4d-icon {
      animation: gift4DUltra 3.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transform-style: preserve-3d;
    }
    .shockwave-ring {
      animation: shockwave4D 1.3s ease-out infinite;
    }
    @keyframes adZoom { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes adFade { 0%,100% { opacity: 1; } 50% { opacity: 0.72; } }
    @keyframes adPulseGlow { 0%,100% { box-shadow: 0 0 18px rgba(245,196,81,0.35); } 50% { box-shadow: 0 0 36px rgba(245,196,81,0.85); } }
    @keyframes adShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
    .ad-motion-zoom img.ad-bg { animation: adZoom 10s ease-in-out infinite; }
    .ad-motion-fade { animation: adFade 4s ease-in-out infinite; }
    .ad-motion-pulse { animation: adPulseGlow 2.4s ease-in-out infinite; }
    .ad-effect-gold { box-shadow: 0 0 28px rgba(245,196,81,0.45); border-color: rgba(245,196,81,0.75) !important; }
    .ad-effect-diamond { box-shadow: 0 0 28px rgba(16,216,190,0.45); border-color: rgba(16,216,190,0.75) !important; }
    .ad-shimmer-bar { position: absolute; inset: 0; width: 45%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent); animation: adShimmer 3.2s infinite; pointer-events: none; }
    @keyframes roomMarquee {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .room-marquee-text {
      display: inline-block;
      white-space: nowrap;
      animation: roomMarquee 18s linear infinite;
    }
    @keyframes petFloatAura {
      0%, 100% { transform: translateY(0px) scale(1); box-shadow: 0 0 14px rgba(245,196,81,0.35); }
      50% { transform: translateY(-4px) scale(1.04); box-shadow: 0 0 26px rgba(16,216,190,0.75); }
    }
    .pet-animated-aura { animation: petFloatAura 2.6s ease-in-out infinite; }
    .luxury-gold-gradient {
      background: linear-gradient(135deg, #fde68a 0%, #f59e0b 50%, #d97706 100%);
      color: #111827;
    }
    .gift-banner-anim {
      animation: giftFloat 3s ease forwards;
    }

    @keyframes eqBar {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }
    .eq-bar { width: 3px; border-radius: 99px; background: var(--accent); animation: none; }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
   .theme-muted{color:color-mix(in srgb,var(--text-muted) 83%,var(--text-main))} :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.control{border:1px solid var(--border-subtle);background:var(--bg-card);color:var(--text-main);padding:.55rem .75rem;border-radius:.8rem;font-size:.8rem;font-weight:700}
input.control{display:block;width:100%}.control:disabled{opacity:.55}.voice-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:.45rem;padding:.5rem .85rem;color:var(--text-main);background:var(--bg-app);font-size:.8rem}.voice-toolbar span{flex:1}
.seat-title{font-size:.8rem;color:#fff;margin:.25rem 0 .65rem;font-weight:800}#micGrid{position:relative;border-radius:1.25rem;background:rgba(10,12,18,.62);padding:.7rem .3rem;color:#fff}
#micGrid .theme-muted{color:#d8dce6}#roomChatStream{color:#fff}#roomChatStream .theme-card{color:var(--text-main)}#roomChatStream>div:not(.theme-card){background:rgba(10,12,18,.75)}
.seat-reaction{position:absolute;left:48%;top:40%;font-size:2rem;pointer-events:none;animation:room-react 1.05s ease-out forwards}@keyframes room-react{to{transform:translateY(-3rem) scale(1.3);opacity:0}}
#livePanel:not([hidden]){display:flex;flex:1;min-height:0;flex-direction:column;background:var(--bg-app);color:var(--text-main)}.in-live [onclick="openRoomPolicy()"],.in-live [onclick="openRoomMembersModal()"],.in-live [onclick="openEditTickerModal()"],.in-live .preview-room,.in-live [onclick="connectLive()"]{display:none}
#livePeople{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:.5rem;padding:1rem;max-height:48%;overflow:auto}
.voice-person{border-radius:1rem;padding:.75rem;border:1px solid var(--border-subtle);background:var(--bg-card);display:grid;gap:.25rem;text-align:center}.voice-person.speaking{outline:2px solid var(--accent)}.voice-person small{color:var(--text-muted)}#liveLog{flex:1;overflow:auto;padding:1rem}#liveLog p{overflow-wrap:anywhere}.voice-toolbar input{flex:1;min-width:0}
@media(max-width:540px){#voiceRoomOverlay .relative.z-10>.border-b:first-child{flex-wrap:wrap}#micGrid .w-14{width:2.65rem;height:2.65rem}#voiceRoomOverlay .preview-room{overflow:auto}#roomChatStream{min-height:4rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}.room-marquee-text{transform:none!important}}
</style>
</head>

    // --- Helpers ---
    function userBadgesHTML(flag = '🇸🇦', gender = 'M') {
      const gIcon = gender === 'F'
        ? '<span class="inline-flex items-center px-1.5 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-400/30 text-[9px] font-bold">♀ أنثى</span>'
        : '<span class="inline-flex items-center px-1.5 py-0.5 rounded-full bg-sky-500/20 text-sky-300 border border-sky-400/30 text-[9px] font-bold">♂ ذكر</span>';
      return `<span class="text-xs">${flag}</span>${gIcon}`;
    }

    function getFrameClass(effect) {
      if (effect === 'turquoise') return 'theme-accent-bg shadow-[0_0_24px_rgba(16,216,190,0.65)]';
      if (effect === 'vfx') return 'bg-gradient-to-tr from-amber-400 via-teal-400 to-fuchsia-500 shadow-[0_0_28px_rgba(245,196,81,0.7)]';
      return 'luxury-gold-gradient shadow-[0_0_24px_rgba(245,196,81,0.55)]';
    }

    function addXP(pts) {
      state.user.xp += pts;
      while (state.user.xp >= 100) {
        state.user.xp -= 100;
        state.user.level += 1;
        showToast('🎉 مبروك! ارتفع مستواك إلى Lv.' + state.user.level);
      }
      const lc = document.getElementById('headerLevelCircle');
      if (lc) lc.textContent = state.user.level;
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      box.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => box.classList.add('hidden'), 2400);
    }

    function updateWalletUI() {
      document.getElementById('headerGold').textContent = state.user.gold.toLocaleString('en-US');
      document.getElementById('headerCrystals').textContent = state.user.crystals.toLocaleString('en-US');
      const dot = document.getElementById('chatUnreadDot');
      if (dot) dot.classList.toggle('hidden', !state.dms.some(d => d.unread > 0));
    }

    function cycleTheme() {
      state.themeIndex = (state.themeIndex + 1) % state.themes.length;
      const t = state.themes[state.themeIndex];
      if (t.id === 'default') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', t.id);
      }
      showToast('الثيم الحالي: ' + t.name);
    }

    function switchTab(tab) {
      if (window._adminMetricsTimer) { clearInterval(window._adminMetricsTimer); window._adminMetricsTimer = null; }
      state.activeTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isCurrent = btn.getAttribute('data-tab') === tab;
        btn.classList.toggle('theme-accent-text', isCurrent);
        btn.classList.toggle('theme-muted', !isCurrent);
      });
      renderMain();
    }

    // --- Main Renderer ---
    function renderMain() {
      const container = document.getElementById('mainContent');
      if (state.activeTab === 'home') renderHomeTab(container);
      else if (state.activeTab === 'rooms') renderRoomsTab(container);
      else if (state.activeTab === 'games') renderGamesTab(container);
      else if (state.activeTab === 'gameDetail') renderGameDetailTab(container);
      else if (state.activeTab === 'events') renderEventsTab(container);
      else if (state.activeTab === 'moments') renderMomentsTab(container);
      else if (state.activeTab === 'chat') renderChatTab(container);
      else if (state.activeTab === 'roles') renderRolesTab(container);
      else if (state.activeTab === 'me') renderMeTab(container);
      lucide.createIcons();
    }

    function getFilteredRooms() {
      return state.rooms.filter(r => {
        if (state.roomDiscoveryTab === 'fav' && !r.isFav) return false;
        if (state.roomDiscoveryTab === 'my' && r.discovery !== 'my') return false;
        if (state.roomDiscoveryTab === 'new' && r.discovery !== 'new') return false;
        if (state.roomCategory !== 'الكل' && state.roomCategory !== 'all' && r.category !== state.roomCategory) return false;
        if (state.searchQuery && !r.title.includes(state.searchQuery) && !r.numId.includes(state.searchQuery)) return false;
        return true;
      });
    }

    function renderRoomCardsHTML() {
      const filtered = getFilteredRooms();
      if (filtered.length === 0) {
        return `<div class="text-center py-10 theme-muted text-sm">لا توجد غرف مطابقة لبحثك حالياً.</div>`;
      }
      return filtered.map(r => `
        <div onclick="enterRoom('${r.id}')" class="relative h-36 rounded-2xl overflow-hidden border cursor-pointer shadow-lg group" style="border-color: var(--border-subtle);">
          <img src="${r.cover}" alt="${htmlText(r.title)}" class="absolute inset-0 w-full h-full object-cover" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/45 to-black/25"></div>
          <div class="relative z-10 h-full p-3 flex flex-col justify-between">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5">
                <span class="px-2 py-0.5 rounded-full bg-black/65 text-[10px] font-bold text-white border border-white/10">${r.flag} ${r.category}</span>
                <span class="px-2 py-0.5 rounded-full bg-black/65 text-[10px] font-bold theme-accent-text flex items-center gap-1">
                  <i data-lucide="headphones" class="w-3 h-3"></i>${r.listeners}
                </span>
              </div>
              <button onclick="event.stopPropagation(); toggleRoomFav('${r.id}')" class="p-1.5 rounded-full bg-black/50 hover:bg-black/75">
                <i data-lucide="heart" class="w-3.5 h-3.5 ${r.isFav ? 'fill-rose-500 text-rose-500' : 'text-slate-300'}"></i>
              </button>
            </div>
            <div>
              <h3 class="font-extrabold text-sm text-white truncate">${htmlText(r.title)}</h3>
              <div class="flex items-center justify-between text-[11px] text-slate-300 mt-0.5">
                <span>المضيف: ${r.host} • ID: ${r.numId}</span>
                <span class="px-2 py-0.5 rounded-lg luxury-gold-gradient text-[10px] font-extrabold">دخول</span>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function claimLevelReward(lv, gold) {
      if (state.user.level < lv) { showToast('تصل لهذه المكافأة عند المستوى Lv.' + lv); return; }
      if (state.claimedLevelRewards.includes(lv)) return;
      state.claimedLevelRewards.push(lv);
      state.user.gold += gold;
      updateWalletUI();
      renderMain();
      showToast(`تم استلام مكافأة المستوى Lv.${lv}: +${gold} 🪙`);
    }

    function claimFestivalBonus() {
      if (state.festivalClaimed) { showToast('تم استلام هدية المهرجان بالفعل'); return; }
      state.festivalClaimed = true;
      state.user.gold += 300;
      state.user.crystals += 20;
      addXP(30);
      updateWalletUI();
      renderMain();
      showToast('مبروك! حصلت على 300 🪙 و 20 💎 من مهرجان هلاا!');
    }

    function renderEventsTab(container) {
      const u = state.user;
      const levelMilestones = [
        { lv: 10, reward: 200 },
        { lv: 20, reward: 500 },
        { lv: 24, reward: 800 },
        { lv: 30, reward: 1500 }
      ];
      container.innerHTML = `
        <div class="p-4 space-y-4">
          <!-- Festival Hero Banner -->
          <div class="relative h-36 rounded-3xl overflow-hidden border shadow-xl" style="border-color: var(--border-subtle);">
            <img src="${state.festivalImg}" alt="مهرجان هلاا" class="w-full h-full object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/45 to-transparent p-4 flex items-end justify-between gap-3">
              <div>
                <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full luxury-gold-gradient">مهرجانات التطبيق الحية</span>
                <h2 class="text-white text-base font-extrabold mt-1">مهرجان الفيروز الملكي 2026</h2>
                <p class="text-amber-300 text-xs font-bold">جوائز فورية: +300 🪙 و +20 💎 و +30 XP</p>
              </div>
              <button onclick="claimFestivalBonus()" class="px-4 py-2 rounded-xl ${state.festivalClaimed ? 'bg-emerald-500/30 text-emerald-300 border border-emerald-400/40' : 'luxury-gold-gradient'} text-xs font-extrabold shrink-0">
                ${state.festivalClaimed ? 'تم الاستلام ✓' : 'استلام الهدية'}
              </button>
            </div>
          </div>

          <!-- 3-Column Events Grid: Level Rewards | Dynamic Daily Tasks | VIP & ID Offers -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">

    function renderHomeTab(container) {
      const topRooms = state.rooms.slice(0, 3);
const topGames = state.gamesCatalog.slice(0, 3).map(g => ({ id: g.id, name: g.name, img: g.img, tag: g.players }));
      const topStore = [state.gamesStoreItems[0], state.gamesStoreItems[3], state.gamesStoreItems[6]];

      container.innerHTML = `
        <div class="p-4 space-y-5">
          <!-- Editable Dynamic Home Ads Banner -->
          ${(() => {
            if(!adVisible()) return ''; const ad = state.homeAd;
            const mCls = ad.motion === 'zoom' ? 'ad-motion-zoom' : ad.motion === 'fade' ? 'ad-motion-fade' : ad.motion === 'pulse' ? 'ad-motion-pulse' : '';
            const eCls = ad.effect === 'gold' ? 'ad-effect-gold' : ad.effect === 'diamond' ? 'ad-effect-diamond' : '';
            return `
            <div class="relative h-40 rounded-3xl overflow-hidden border shadow-xl ${mCls} ${eCls}" style="border-color: var(--border-subtle);">
              <img src="${ad.bgImg}" alt="${htmlText(ad.title)}" class="ad-bg w-full h-full object-cover" />
              ${ad.effect === 'shimmer' ? '<div class="ad-shimmer-bar"></div>' : ''}
              <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/45 to-black/20 p-4 flex items-end justify-between gap-3">
                <div class="min-w-0">
                  <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full luxury-gold-gradient">${htmlText(ad.badge)}</span>
                  <h2 class="text-white font-extrabold text-base mt-1 truncate">${htmlText(ad.title)}</h2>
                  <p class="text-slate-300 text-xs truncate">${htmlText(ad.subtitle)}</p>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <button onclick="switchTab('roles')" class="px-2.5 py-2 rounded-xl border border-white/25 bg-black/55 text-white text-[11px] font-bold" title="تعديل من الإدارة">⚙️ الإدارة</button>
                  <button onclick="enterRoom('r1')" class="px-4 py-2 rounded-xl luxury-gold-gradient text-xs font-extrabold shadow">${htmlText(ad.cta)}</button>
                </div>
              </div>
            </div>`;
          })()}

          <!-- 1. Rooms Row (3 per row) -->
          <section class="space-y-2.5">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-extrabold flex items-center gap-1.5"><span class="theme-gold-text">✦</span><span>الغرف الصوتية المباشرة</span></h3>
              <button onclick="switchTab('rooms')" class="text-xs font-bold theme-accent-text">عرض الكل ◀</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
              ${topRooms.map(r => `
                <div onclick="enterRoom('${r.id}')" class="relative h-32 rounded-2xl overflow-hidden border cursor-pointer shadow-lg" style="border-color: var(--border-subtle);">
                  <img src="${r.cover}" alt="${htmlText(r.title)}" class="absolute inset-0 w-full h-full object-cover" />
                  <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-black/20"></div>
                  <div class="relative z-10 h-full p-3 flex flex-col justify-between">
                    <div class="flex items-center justify-between">
                      <span class="px-2 py-0.5 rounded-full bg-black/65 text-[10px] font-bold text-white">${r.flag} ${r.category}</span>
                      <span class="px-2 py-0.5 rounded-full bg-black/65 text-[10px] font-bold theme-accent-text">🎧 ${r.listeners}</span>
                    </div>
                    <h4 class="font-extrabold text-xs text-white truncate">${htmlText(r.title)}</h4>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>

          <!-- 2. Games Row (3 per row) -->
          <section class="space-y-2.5">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-extrabold flex items-center gap-1.5"><span class="theme-gold-text">✦</span><span>ألعاب النخبة</span></h3>
              <button onclick="switchTab('games')" class="text-xs font-bold theme-accent-text">عرض الكل ◀</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
              ${topGames.map(gm => `
                <button onclick="openGameModal('${gm.id}')" class="relative h-32 rounded-2xl overflow-hidden border text-right shadow-lg" style="border-color: var(--border-subtle);">
                  <img src="${gm.img}" alt="${gm.name}" class="absolute inset-0 w-full h-full object-cover" />
                  <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/35 to-transparent"></div>
                  <div class="relative z-10 h-full p-3 flex flex-col justify-between">
                    <span class="self-start px-2 py-0.5 rounded-full bg-black/65 text-[10px] font-bold text-amber-300">● ${gm.tag}</span>
                    <div class="font-extrabold text-xs text-white">${gm.name}</div>
                  </div>
                </button>
              `).join('')}
            </div>
          </section>

          <!-- 3. Stores Row (3 per row) -->
          <section class="space-y-2.5">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-extrabold flex items-center gap-1.5"><span class="theme-gold-text">✦</span><span>المتاجر الملكية</span></h3>
              <button onclick="openGamesStoreModal('الكل')" class="text-xs font-bold theme-accent-text">دخول المتجر ◀</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
              ${topStore.map(item => `
                <div onclick="openGamesStoreModal('الكل')" class="p-3.5 rounded-2xl border theme-card cursor-pointer flex items-center justify-between gap-2 shadow-md">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-12 h-12 rounded-xl overflow-hidden border shrink-0 shadow" style="border-color: var(--border-subtle);"><img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover" /></div>
                    <div class="min-w-0">
                      <div class="font-extrabold text-xs truncate">${item.name}</div>
                      <div class="text-[10px] theme-gold-text font-bold mt-0.5">🪙 ${item.price.toLocaleString('en-US')}</div>
                    </div>
                  </div>
                  <span class="px-2 py-1 rounded-lg luxury-gold-gradient text-[10px] font-extrabold shrink-0">${item.tier}</span>
                </div>
              `).join('')}
            </div>
          </section>
        </div>
      `;
    }

    function renderMomentsTab(container) {
      const stories = [
        { name: 'قصتي', avatar: '➕', active: false },
        { name: 'سارة', avatar: '💎', active: true },
        { name: 'بدر', avatar: '🦁', active: true },
        { name: 'نورة', avatar: '🌸', active: true },
        { name: 'فيصل', avatar: '🦅', active: true }
      ];

      container.innerHTML = `
        <div class="p-4 space-y-4">
          <!-- Stories Row -->
          <div class="flex items-center gap-3 overflow-x-auto no-scrollbar pb-1">
            ${stories.map((s, idx) => `
              <button onclick="${idx === 0 ? 'openPostMomentModal()' : `showToast('تشاهد قصة ${s.name}')`}" class="flex flex-col items-center gap-1 shrink-0">
                <div class="w-14 h-14 rounded-full p-0.5 ${s.active ? 'theme-accent-bg' : 'border border-dashed border-slate-500'}">
                  <div class="w-full h-full rounded-full theme-surface flex items-center justify-center text-xl">${s.avatar}</div>
                </div>
                <span class="text-[11px] font-semibold">${s.name}</span>
              </button>
            `).join('')}
          </div>

          <div class="flex justify-between items-center">
            <h2 class="text-sm font-bold">أحدث اللحظات</h2>
            <button onclick="openPostMomentModal()" class="px-3 py-1.5 rounded-full text-xs font-bold theme-accent-bg flex items-center gap-1">
              <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
              <span>نشر لحظة</span>
            </button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            ${state.moments.map(m => `
              <div class="p-4 rounded-2xl border theme-card space-y-3">
                <div class="flex items-center gap-2.5">
                  <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-lg">${m.avatar}</div>
                  <div>
                    <h4 class="font-bold text-sm flex items-center gap-1.5 flex-wrap">${m.author} ${userBadgesHTML(m.flag || '🇸🇦', m.gender || 'M')}</h4>
                    <span class="text-[11px] theme-muted">${m.time}</span>
                  </div>
                </div>
                <p class="text-xs leading-relaxed">${m.text}</p>
                ${m.poll ? `
                  <div class="p-3 rounded-xl bg-black/20 space-y-2">
                    <p class="text-xs font-bold">${m.poll.q}</p>
                    ${m.poll.options.map((opt, idx) => {
                      const total = m.poll.options.reduce((a, b) => a + b.votes, 0);
                      const pct = Math.round((opt.votes / total) * 100);
                      const isVoted = m.poll.votedIdx === idx;
                      return `
                        <button onclick="votePoll('${m.id}', ${idx})" class="w-full text-right p-2 rounded-lg border text-xs relative overflow-hidden transition ${isVoted ? 'border-teal-400' : 'border-white/10'}">
                          <div class="absolute inset-y-0 right-0 bg-teal-500/20" style="width: ${m.poll.votedIdx !== null ? pct : 0}%"></div>
                          <div class="relative flex justify-between font-semibold">
                            <span>${opt.text}</span>
                            ${m.poll.votedIdx !== null ? `<span>${pct}%</span>` : ''}
                          </div>
                        </button>
                      `;
                    }).join('')}
                  </div>
                ` : ''}
                <div class="flex items-center gap-4 pt-1 border-t text-xs theme-muted" style="border-color: var(--border-subtle);">
                  <button onclick="toggleMomentLike('${m.id}')" class="flex items-center gap-1 ${m.liked ? 'text-rose-400 font-bold' : ''}">
                    <i data-lucide="heart" class="w-4 h-4 ${m.liked ? 'fill-rose-400' : ''}"></i>
                    <span>${m.likes}</span>
                  </button>
                  <button onclick="showToast('التعليقات متاحة للمتابعين فقط')" class="flex items-center gap-1">
                    <i data-lucide="message-square" class="w-4 h-4"></i>
                    <span>تعليق</span>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderChatTab(container) {
      container.innerHTML = `

    function formatRemainingServerTime(expiresAtMs) {
      if (!expiresAtMs || expiresAtMs <= state.serverEpochMs) return 'غير مشترك';
      const diff = expiresAtMs - state.serverEpochMs;
      const days = Math.floor(diff / 86400000);
      const hrs = Math.floor((diff % 86400000) / 3600000);
      return `متبقي ${days} يوم و ${hrs} ساعة`;
    }

    function subscribeBadgeDays(badgeId, days, price) {
      const b = state.badgeSubscriptions.find(x => x.id === badgeId);
      if (!b) return;
      if (state.user.gold < price) { showToast('رصيد الذهب غير كافٍ للاشتراك'); return; }
      state.user.gold -= price;
      const base = (b.expiresAtMs && b.expiresAtMs > state.serverEpochMs) ? b.expiresAtMs : state.serverEpochMs;
      b.expiresAtMs = base + days * 86400000;
      updateWalletUI();
      if (state.activeTab === 'me') renderMain();
      openBadgesModal();
      showToast(`تم تفعيل «${b.name}» لمدة ${days} يوماً بتوقيت السيرفر!`);
    }

    function openBadgesModal() {
      const srvTimeStr = new Date(state.serverEpochMs).toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
      openModal(`
        <div class="space-y-4">
          <div class="flex justify-between items-center border-b pb-2.5" style="border-color: var(--border-subtle);">

              const active = b.expiresAtMs && b.expiresAtMs > state.serverEpochMs;
              return `

    function setAppLang(lang) {
      state.settings.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;
      closeModal();
      renderMain();
      showToast(lang === 'ar' ? 'تم التبديل للعربية' : 'Switched to English (LTR)');
    }

    function openRedeemCodeModal() {
      openModal(`
        <form onsubmit="redeemPromoCode(event)" class="space-y-3">
          <div class="flex justify-between items-center"><h3 class="font-extrabold text-sm">كود الاستبدال</h3><button type="button" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
          <input id="redeemInp" required type="text" placeholder="أدخل الكود (مثال: HALAA2026)" class="w-full px-3.5 py-2.5 rounded-xl text-xs border theme-card focus:outline-none" />
          <button type="submit" class="w-full py-2.5 rounded-xl luxury-gold-gradient font-extrabold text-xs">استبدال الآن</button>
        </form>
      `);
    }

    function redeemPromoCode(e) {
      e.preventDefault();
      const code = document.getElementById('redeemInp').value.trim().toUpperCase();
      if (state.redeemedCodes.includes(code)) { showToast('تم استخدام هذا الكود مسبقاً'); return; }
      state.redeemedCodes.push(code);
      state.user.gold += 500;
      updateWalletUI();
      closeModal();
      renderMain();
      showToast('تم تفعيل الكود بنجاح! +500 🪙');
    }

      updateWalletUI();
      renderMain();

    function getMicRequiredLevel(idx) {
      if (idx < 8) return 1;
      if (idx < 10) return 15;
      return 25;
    }

    function initMics(count) {
      const sampleHosts = [
        { name: state.activeRoom.host, avatar: '🎙️', flag: '🇸🇦', gender: 'M', speaking: true, muted: false },
        { name: 'الأمير خالد', avatar: '🦁', flag: '🇸🇦', gender: 'M', speaking: false, muted: false },
        { name: 'سارة ✨', avatar: '💎', flag: '🇸🇦', gender: 'F', speaking: true, muted: false }
      ];
      state.mics = Array.from({ length: count }, (_, i) => {
        const reqLv = getMicRequiredLevel(i);
        const locked = state.roomLevel < reqLv;
        if (i < sampleHosts.length) return { index: i, occupied: true, locked: false, reqLv, ...sampleHosts[i], isMe: false };
        return { index: i, occupied: false, locked, reqLv, name: 'مقعد ' + (i + 1), avatar: '', speaking: false, muted: false, isMe: false };
      });
    }

    function cycleSeatCount() {
      const modes = [8, 10, 12];
      const next = modes[(modes.indexOf(state.seatMode) + 1) % modes.length];
      state.seatMode = next;
      document.getElementById('seatModeLabel').textContent = next + ' مايك';
      initMics(next);
      renderMics();
      showToast(`تم تحويل الغرفة إلى ${next} مقاعد`);
    }

    function renderMics() {
      const grid = document.getElementById('micGrid');
      grid.className = state.seatMode === 8 ? 'grid grid-cols-4 gap-3' : 'grid grid-cols-4 gap-2';
      grid.innerHTML = state.mics.map(m => {
        if (m.locked) {
          return `
            <button onclick="clickMic(${m.index})" class="flex flex-col items-center gap-1 opacity-75">
              <div class="w-14 h-14 rounded-full border-2 border-amber-400/35 bg-black/50 flex flex-col items-center justify-center">
                <i data-lucide="lock" class="w-4 h-4 theme-gold-text"></i>
                <span class="text-[8px] theme-gold-text font-bold">Lv.${m.reqLv}</span>
              </div>
              <span class="text-[10px] theme-muted">مغلق</span>
            </button>
          `;
        }
        if (!m.occupied) {
          return `
            <button onclick="clickMic(${m.index})" class="flex flex-col items-center gap-1 group">
              <div class="w-14 h-14 rounded-full border-2 border-dashed theme-card flex items-center justify-center group-hover:border-teal-400 transition">
                <i data-lucide="plus" class="w-5 h-5 theme-muted"></i>
              </div>
              <span class="text-[10px] theme-muted">${m.index + 1}</span>
            </button>
          `;
        }
        return `
          <button onclick="clickMic(${m.index})" class="flex flex-col items-center gap-1 relative">
            <div class="w-14 h-14 rounded-full border-2 ${m.speaking && !m.muted ? 'mic-speaking' : 'border-white/20'} bg-slate-800/80 flex items-center justify-center text-2xl relative shadow-md">
              ${m.isMe ? `<img src="${state.user.avatarImg}" class="w-full h-full rounded-full object-cover" />` : `<span>${m.avatar}</span>`}
              ${m.muted ? '<span class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-rose-500 flex items-center justify-center"><i data-lucide="mic-off" class="w-3 h-3 text-white"></i></span>' : ''}
            </div>
            <span class="text-[11px] font-bold truncate max-w-[74px] ${m.isMe ? 'theme-accent-text' : ''}">${m.flag || '🇸🇦'} ${m.gender === 'F' ? '♀' : '♂'} ${m.name}</span>
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    function clickMic(idx) {
      const mic = state.mics[idx];
      if(!mic)return;
      if(!mic.occupied&&!roomPolicy().voice){showToast("صعود المقاعد مغلق في هذه الغرفة");return;}
      if (mic.locked) { showToast(`هذا المايك يفتح عند وصول الغرفة إلى المستوى Lv.${mic.reqLv}`); return; }
      if (!mic.occupied) {
        // Leave any previous mic I occupy
        state.mics.forEach(m => {
          if (m.isMe) { m.occupied = false; m.isMe = false; m.name = 'مقعد ' + (m.index + 1); }
        });
        mic.occupied = true;
        mic.isMe = true;
        mic.name = 'أنت';
        mic.avatar = state.user.avatar;
        mic.speaking = true;
        mic.muted = false;
        renderMics();
        showToast('صعدت على المايك رقم ' + (idx + 1));
      } else if (mic.isMe) {
        mic.occupied = false;
        mic.isMe = false;
        mic.speaking = false;
        mic.name = 'مقعد ' + (idx + 1);
        renderMics();
        showToast('نزلت من المايك');
      } else {
        openMicUserSheet(mic);
      }
    }

    function toggleMyMicMute() {
      const myMic = state.mics.find(m => m.isMe);
      if (!myMic) { showToast('اصعد على مايك أولاً'); return; }
      myMic.muted = !myMic.muted;
      myMic.speaking = !myMic.muted;
      renderMics();
      showToast(myMic.muted ? 'تم كتم المايك' : 'المايك مفتوح الآن');
    }

    function renderRoomChats() {
      const stream = document.getElementById('roomChatStream');
      stream.innerHTML = state.roomChats.map(c => {
        if (c.isSystem) {
          return `<div class="text-[11px] px-3 py-1 rounded-xl border theme-card theme-accent-text font-semibold inline-block">${htmlText(c.text)}</div>`;
        }
        if (c.mediaType) {
          return `
            <div class="text-xs p-2 rounded-2xl bg-black/40 border border-amber-400/30 max-w-[85%] space-y-1.5">
              <div class="font-bold theme-gold-text">${htmlText(c.sender)}: ${htmlText(c.text)}</div>
              <div class="relative h-20 w-36 rounded-xl overflow-hidden border border-white/15">
                <img src="${c.mediaImg}" alt="media" class="w-full h-full object-cover" />
                ${c.mediaType === 'video' ? '<span class="absolute inset-0 flex items-center justify-center bg-black/40 text-white text-lg">▶</span>' : ''}
              </div>
            </div>
          `;
        }
        return `
          <div class="text-xs px-3 py-1.5 rounded-2xl bg-black/25 max-w-[90%]">
            <span class="font-bold theme-gold-text ml-1">${htmlText(c.sender)}:</span>
            <span>${htmlText(c.text)}</span>
          </div>
        `;
      }).join('');
      stream.scrollTop = stream.scrollHeight;
    }

    function sendRoomChat(e) {
      e.preventDefault();if(!roomPolicy().chat){showToast('الدردشة مغلقة');return;}
      const input = document.getElementById('roomChatInput');
      const txt = input.value.trim();
      if (!txt) return;
      state.roomChats.push({ sender: 'أنت', text: txt, isSystem: false });
      input.value = '';
      renderRoomChats();
    }

    function sendMicEmoji(emoji) {
      if(!roomPolicy().reactions){showToast('التفاعلات مغلقة');return;}
      const reaction=document.createElement('span');reaction.className='seat-reaction';reaction.textContent=emoji;
      $room('micGrid').append(reaction);setTimeout(()=>reaction.remove(),1100);
      state.roomChats.push({ sender: 'أنت', text: `تفاعل على المايك: ${emoji}`, isSystem: false });
      renderRoomChats();
    }

    function cycleVoiceEffect() {
      const effects = ['طبيعي', 'صدى المجلس', 'استوديو HD'];
      state.voiceEffect = effects[(effects.indexOf(state.voiceEffect) + 1) % effects.length];
      const lbl = document.getElementById('voiceEffectLabel');
      if (lbl) lbl.textContent = state.voiceEffect;
      showToast('فلتر الصوت: ' + state.voiceEffect);
    }

    function claimTreasureChest() {
      if (state.chestClaimed) { showToast('تم جمع الصندوق بالفعل، انتظر الجولة القادمة'); return; }
      state.chestClaimed = true;
      state.user.gold += 100;
      updateWalletUI();
      document.getElementById('chestTimer').textContent = 'تم الجمع';
      showToast('مبروك! حصلت على 100 عملة من صندوق الكنز 🎁');
    }

    function minimizeRoom() {
      document.getElementById('voiceRoomOverlay').classList.add('hidden');
      document.getElementById('floatingRoomBubble').classList.remove('hidden');
      state.isRoomMinimized = true;
    }

    function reopenActiveRoom() {
      document.getElementById('floatingRoomBubble').classList.add('hidden');
      document.getElementById('voiceRoomOverlay').classList.remove('hidden');
      state.isRoomMinimized = false;
    }

    function rememberRoom(){
      if(!state.activeRoom)return;
      const seats=state.mics.map(m=>m.isMe?{...m,isMe:false,occupied:false,speaking:false,muted:false,name:'مقعد '+(m.index+1)}:{...m});
      roomSessions.set(state.activeRoom.id,{chats:state.roomChats.slice(-100),count:state.seatMode,mics:seats});
    }
    function leaveRoom() {
      rememberRoom();stopLive();
      document.getElementById('voiceRoomOverlay').classList.add('hidden');
      document.getElementById('floatingRoomBubble').classList.add('hidden');
      state.activeRoom = null;
    }

    // --- Modals ---
    function openModal(html) {
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modalOverlay').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    function openMicUserSheet(mic) {
      openModal(`
        <div class="space-y-4 text-center">
          <div class="flex justify-between items-center">
            <h3 class="font-extrabold text-sm">خيارات المتحدث</h3>
            <button onclick="closeModal()" class="p-1 rounded-full hover:bg-black/10"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div class="flex flex-col items-center gap-2 py-2">
            <div class="w-16 h-16 rounded-full theme-accent-bg flex items-center justify-center text-3xl shadow">${mic.avatar}</div>
            <div class="font-bold text-base">${mic.name}</div>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <button onclick="openGiftDrawer('${mic.name}')" class="py-2.5 rounded-xl theme-accent-bg font-bold text-xs flex items-center justify-center gap-1.5"><span>🎁</span><span>إرسال هدية</span></button>
            <button onclick="closeModal(); showToast('تمت متابعة ${mic.name}')" class="py-2.5 rounded-xl border theme-card font-bold text-xs">متابعة</button>
          </div>
        </div>
      `);
    }

    function openGiftDrawer(targetName = 'الجميع على المايك') {
      openModal(`
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-extrabold text-sm">إرسال هدية إلى: <span class="theme-accent-text">${targetName}</span></h3>
            <button onclick="closeModal()" class="p-1 rounded-full hover:bg-white/10"><i data-lucide="x" class="w-4 h-4"></i></button>

    function playLuxuryGiftSound() {
      if (!state.roomSoundEnabled || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.08, ctx.currentTime + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.09 + 0.45);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.09);
          if(i===notes.length-1) osc.onended=()=>ctx.close().catch(()=>{});
          osc.stop(ctx.currentTime + i * 0.09 + 0.45);
        });
      } catch (e) {}
    }

      e.preventDefault();
      const localTime=id=>$room(id).value ? new Date($room(id).value).getTime() : null;

        motion:$room('adMotionSel').value,effect:$room('adEffectSel').value,imageIndex:Number($room('adBgSel').value)};

              <div>
                <label class="font-bold block mb-1 theme-muted">رفع صورة شخصية مخصصة</label>
                <input id="admAvatarUpload" type="file" accept="image/*" onchange="uploadCustomAppImg(event, 'avatar')" class="w-full text-[11px] file:ml-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:font-bold file:bg-amber-400 file:text-slate-950" />
              </div>
              <div>
                <label class="font-bold block mb-1 theme-muted">رفع صورة مهرجان الأحداث</label>
                <input id="admFestUpload" type="file" accept="image/*" onchange="uploadCustomAppImg(event, 'festival')" class="w-full text-[11px] file:ml-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:font-bold file:bg-teal-400 file:text-slate-950" />
              </div>
              <div>
                <label class="font-bold block mb-1 theme-muted">تغيير صورة شاشة لعبة</label>
                <div class="flex gap-1.5">
                  <select id="admGameTargetSel" class="flex-1 px-2 py-1.5 rounded-xl border theme-card text-[11px]">
                    ${state.gamesCatalog.map(g => `<option value="${g.id}">${g.name}</option>`).join('')}
                  </select>
                  <input type="file" accept="image/*" onchange="uploadGameCoverImg(event)" class="w-24 text-[10px] file:py-1.5 file:px-2 file:rounded-xl file:border-0 file:font-bold file:bg-amber-400 file:text-slate-950" />
                </div>
              </div>
              <div class="flex items-end md:col-span-3">
                <button onclick="applyFullAppEdits()" class="w-full py-2.5 rounded-xl luxury-gold-gradient font-extrabold text-xs shadow">تطبيق التعديلات على التطبيق</button>
              </div>
            </div>
          </div>

          <!-- Admin Home Ad Banner Editor -->
          <form onsubmit="saveHomeAdSettings(event)" class="p-4 rounded-3xl border theme-card space-y-3 shadow-lg">
            <div class="flex items-center justify-between border-b pb-2" style="border-color: var(--border-subtle);">
              <div>
                <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full luxury-gold-gradient">إعلانات الرئيسية</span>
                <h2 class="text-sm font-extrabold mt-1">إدارة مربع إعلانات الصفحة الرئيسية والحركة</h2>
              </div>
              <span class="text-2xl">📢</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
              <div>
                <label class="block"><input type="checkbox" id="adEnabled" ${state.homeAd.enabled?'checked':''}> عرض الإعلان</label>
<label class="block py-1">البداية بتوقيت جهازك<input class="control" type="datetime-local" id="adStart" value="${dateInput(state.homeAd.start)}"></label>
<label class="block py-1">النهاية بتوقيت جهازك<input class="control" type="datetime-local" id="adEnd" value="${dateInput(state.homeAd.end)}"></label><label class="font-bold block mb-1 theme-muted">شارة الإعلان</label>
                <input id="adBadgeInp" type="text" value="${htmlText(state.homeAd.badge)}" required class="w-full px-3 py-2 rounded-xl border theme-card focus:outline-none" />
              </div>
              <div>
                <label class="font-bold block mb-1 theme-muted">عنوان الإعلان</label>
                <input id="adTitleInp" type="text" value="${htmlText(state.homeAd.title)}" required class="w-full px-3 py-2 rounded-xl border theme-card focus:outline-none" />
              </div>
              <div>
                <label class="font-bold block mb-1 theme-muted">الوصف المختصر</label>
                <input id="adSubInp" type="text" value="${htmlText(state.homeAd.subtitle)}" required class="w-full px-3 py-2 rounded-xl border theme-card focus:outline-none" />
              </div>
              <div>
                <label class="font-bold block mb-1 theme-muted">نص الزر (CTA)</label>
                <input id="adCtaInp" type="text" value="${htmlText(state.homeAd.cta)}" required class="w-full px-3 py-2 rounded-xl border theme-card focus:outline-none" />
              </div>
              <div>
                <label class="font-bold block mb-1 theme-muted">نوع الحركة</label>
                <select id="adMotionSel" class="w-full px-3 py-2 rounded-xl border theme-card focus:outline-none">
                  <option value="zoom" ${state.homeAd.motion === 'zoom' ? 'selected' : ''}>تقريب سينمائي (Zoom)</option>
                  <option value="fade" ${state.homeAd.motion === 'fade' ? 'selected' : ''}>تلاشي ناعم (Fade)</option>
                  <option value="pulse" ${state.homeAd.motion === 'pulse' ? 'selected' : ''}>نبض ذهبي (Pulse)</option>
                  <option value="static" ${state.homeAd.motion === 'static' ? 'selected' : ''}>ثابت بدون حركة</option>
                </select>
              </div>
              <div>
                <label class="font-bold block mb-1 theme-muted">التأثيرات البصرية</label>
                <select id="adEffectSel" class="w-full px-3 py-2 rounded-xl border theme-card focus:outline-none">
                  <option value="gold" ${state.homeAd.effect === 'gold' ? 'selected' : ''}>توهج وإطار ذهبي</option>
                  <option value="shimmer" ${state.homeAd.effect === 'shimmer' ? 'selected' : ''}>بريق ضوئي متحرك (Shimmer)</option>
                  <option value="diamond" ${state.homeAd.effect === 'diamond' ? 'selected' : ''}>إطار ماسي فيروزي</option>
                  <option value="none" ${state.homeAd.effect === 'none' ? 'selected' : ''}>بدون تأثير إضافي</option>
                </select>
              </div>
              <div class="md:col-span-3">
                <label class="font-bold block mb-1 theme-muted">خلفية الإعلان</label>
                <select id="adBgSel" class="w-full px-3 py-2 rounded-xl border theme-card focus:outline-none">
                  <option value="0" ${state.homeAd.imageIndex === 0 ? 'selected' : ''}>مجلس هلاا الفيروزي</option>
                  <option value="1" ${state.homeAd.imageIndex === 1 ? 'selected' : ''}>القاعة الملكية الذهبية</option>
                  <option value="2" ${state.homeAd.imageIndex === 2 ? 'selected' : ''}>لاونج الألعاب والبطولات</option>
                  <option value="3" ${state.homeAd.imageIndex === 3 ? 'selected' : ''}>مجلس القهوة والشعر</option>
                </select>
              </div>
            </div>
            <div class="flex justify-end pt-1">
              <button type="submit" class="px-5 py-2 rounded-xl luxury-gold-gradient text-xs font-extrabold shadow">حفظ وتطبيق الإعلان</button>
            </div>
          </form>
        </div>
      `;

      // Start live dynamic telemetry updates while on Admin tab
      window._adminMetricsTimer = setInterval(() => {
        const uEl = document.getElementById('metricActiveUsers');
        const pEl = document.getElementById('metricPing');
        if (!uEl || !pEl) return;
        state.adminControl.liveMetrics.activeUsers += Math.floor(Math.random() * 5) - 2;

      }, 2500);
    }

    function buyGameStoreItem(id) {
      const item = state.gamesStoreItems.find(x => x.id === id);
      if (!item || item.owned) return;
      if (state.user.gold < item.price) { showToast('رصيد الذهب غير كافٍ'); return; }
      state.user.gold -= item.price;
      item.owned = true;
      updateWalletUI();
      openGamesStoreModal(state.gamesStoreCat);
      showToast(`تم اقتناء وتفعيل ${item.name}!`);
    }

                <div class="flex items-center justify-between w-full">

          <div class="flex items-center justify-between pt-2 border-t text-xs" style="border-color: var(--border-subtle);">

            <button onclick="openStoreModal()" class="px-4 py-1.5 rounded-xl theme-accent-bg font-extrabold">الذهاب للمتجر</button>

    function rechargeWallet(gold, crys, label) {
      state.user.gold += gold;
      state.user.crystals += crys;
      updateWalletUI();
      openWalletModal();
      showToast('تم شحن المحفظة بنجاح: ' + label);

                  </div>
                </div>
                <button onclick="buyStoreItem('${item.id}')" class="w-full py-2 rounded-xl text-xs font-extrabold ${item.owned ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'luxury-gold-gradient'}">

              </div>
            `).join('')}
          </div>
        </div>
      `);
    }

    function buyStoreItem(id) {
      const item = state.storeItems.find(x => x.id === id);
      if (!item || item.owned) return;
      if (state.user.gold < item.price) { showToast('رصيد الذهب غير كافٍ'); return; }
      state.user.gold -= item.price;
      item.owned = true;
      if (item.type === 'إطار') {
        state.user.frame = item.name;
        state.user.frameEffect = 'turquoise';
        const hb = document.getElementById('headerAvatarBtn');
        if (hb) hb.className = 'relative w-14 h-14 rounded-full p-1 ' + getFrameClass('turquoise') + ' shrink-0 cursor-pointer';
      }
      if (item.type === 'VIP') state.user.vip = 'الفارس';
      updateWalletUI();
      openStoreModal();
      if (state.activeTab === 'me') renderMain();
      showToast(`تم شراء وتفعيل ${item.name} بنجاح!`);
    }

    function setGameCfg(key, val, gameId) {
      state.gameMatchConfig[key] = val;
      state.selectedGameId = gameId;
      renderMain();
    }

    function openGameModal(gameId) {
      state.selectedGameId = gameId || 'ludo';
      closeModal();
      switchTab('gameDetail');
    }

              <i data-lucide="arrow-right" class="w-4 h-4 theme-gold-text"></i>
              <span>العودة لصالة الألعاب</span>
            </button>

          <div class="relative h-44 rounded-3xl overflow-hidden border border-amber-400/50 shadow-2xl">

            <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-transparent p-5 flex items-end justify-between">
              <div>
                <h2 class="text-white font-extrabold text-xl">${gm.name}</h2>

              </div>
              <button onclick="openGamesStoreModal('الكل')" class="px-3.5 py-2 rounded-xl border border-amber-400/40 bg-black/60 text-amber-300 text-xs font-extrabold">متجر أدوات اللعبة</button>
            </div>
          </div>

          <!-- Full-Page 3-Column Screen Options -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3.5 text-xs">
            <div class="p-4 rounded-3xl border theme-card space-y-2.5 shadow-md">
              <div class="font-extrabold text-sm theme-gold-text">🏆 الاشتراك في البطولات</div>
              ${['طاولة مفتوحة', 'بطولة اليوم (2,000 🪙)', 'كأس النخبة (10,000 🪙)'].map(t => `
                <button onclick="setGameCfg('tournament', '${t}', '${gm.id}')" class="w-full p-2.5 rounded-2xl border text-right font-bold text-xs ${cfg.tournament === t ? 'luxury-gold-gradient border-transparent' : 'border-white/10 bg-black/25'}">${t}</button>
              `).join('')}
            </div>

            <div class="p-4 rounded-3xl border theme-card space-y-2.5 shadow-md">
              <div class="font-extrabold text-sm theme-accent-text">🎮 نوع اللعب والخيارات</div>
              <div class="grid grid-cols-2 gap-2">
                ${['1 ضد 1', '2 ضد 2', '4 لاعبين', 'طاولة خاصة'].map(m => `
                  <button onclick="setGameCfg('mode', '${m}', '${gm.id}')" class="p-2.5 rounded-2xl border font-bold text-xs ${cfg.mode === m ? 'theme-accent-bg border-transparent' : 'border-white/10 bg-black/25'}">${m}</button>
                `).join('')}
              </div>
              <div class="pt-1 space-y-1.5">
                <button onclick="setGameCfg('voiceOn', ${!cfg.voiceOn}, '${gm.id}')" class="w-full px-3 py-2 rounded-2xl bg-black/30 flex justify-between"><span>🎙️ مايك الطاولة الصوتي</span><span class="font-bold ${cfg.voiceOn ? 'text-emerald-400' : 'text-rose-400'}">${cfg.voiceOn ? 'مفعل' : 'صامت'}</span></button>
                <button onclick="setGameCfg('vfxOn', ${!cfg.vfxOn}, '${gm.id}')" class="w-full px-3 py-2 rounded-2xl bg-black/30 flex justify-between"><span>🔥 إشعال التأثيرات 4D</span><span class="font-bold ${cfg.vfxOn ? 'theme-gold-text' : 'theme-muted'}">${cfg.vfxOn ? 'مفعل' : 'معطل'}</span></button>
              </div>
            </div>

            <div class="p-4 rounded-3xl border theme-card space-y-2.5 shadow-md">
              <div class="font-extrabold text-sm theme-gold-text">🪙 تحديد مبلغ الرهان</div>
              <div class="grid grid-cols-2 gap-2">
                ${[50, 250, 1000, 5000].map(st => `
                  <button onclick="setGameCfg('stake', ${st}, '${gm.id}')" class="p-2.5 rounded-2xl border font-extrabold text-xs ${cfg.stake === st ? 'luxury-gold-gradient border-transparent' : 'border-white/10 bg-black/25'}">${st.toLocaleString('en-US')} 🪙</button>
                `).join('')}
              </div>
              <div class="p-3 rounded-2xl bg-black/35 text-center space-y-1.5">
                <div id="diceDisplay" class="text-4xl">🎲</div>
                <p id="diceResultText" class="text-[11px] theme-muted">الرهان: ${cfg.stake.toLocaleString('en-US')} 🪙 • الجائزة: ${(cfg.stake * 2).toLocaleString('en-US')} 🪙</p>
              </div>
            </div>
          </div>

          <button onclick="startConfiguredMatch('${gm.id}')" class="w-full py-3.5 rounded-2xl luxury-gold-gradient font-extrabold text-sm shadow-xl">بدء التحدي والمطابقة الآن (${cfg.mode} • ${cfg.stake.toLocaleString('en-US')} 🪙)</button>
        </div>
      `;
    }

    function startConfiguredMatch(gameId) {
      const stake = state.gameMatchConfig.stake;
      if (state.user.gold < stake) { showToast('رصيد الذهب غير كافٍ للرهان!'); return; }
      state.user.gold -= stake;
      rollQuickDice(stake);
    }

    function rollQuickDice(stake = 100) {
      state.eventTasks.gamePlayed = true;
      addXP(15);
      const val = Math.floor(Math.random() * 6) + 1;
      const icons = ['1️⃣', '2️⃣', '3️⃣', '4️⃣', '5️⃣', '6️⃣'];
      document.getElementById('diceDisplay').textContent = icons[val - 1];
      const won = val >= 4;
      if (won) { state.user.gold += stake * 2; }
      updateWalletUI();
      document.getElementById('diceResultText').textContent = won ? `فوز ساحق (${val})! ربحت +${(stake * 2).toLocaleString('en-US')} 🪙` : `نتيجة (${val}) — حظاً أوفر في الجولة القادمة!`;
    }

    function openPostMomentModal() {
      openModal(`
        <form onsubmit="submitMoment(event)" class="space-y-3">
          <div class="flex justify-between items-center">
            <h3 class="font-extrabold text-sm">نشر لحظة جديدة</h3>
            <button type="button" onclick="closeModal()" class="p-1 rounded-full hover:bg-white/10"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <textarea id="momentInput" required rows="3" placeholder="شارك أصدقاءك ما يدور في بالك..." class="w-full p-3 rounded-xl text-xs border theme-card focus:outline-none"></textarea>
          <button type="submit" class="w-full py-2.5 rounded-xl theme-accent-bg font-bold text-xs">نشر الآن</button>
        </form>
      `);
    }

    function submitMoment(e) {
      e.preventDefault();
      const txt = document.getElementById('momentInput').value.trim();
      state.moments.unshift({ id: 'm_' + Date.now(), author: 'أنت', avatar: state.user.avatar, time: 'الآن', text: txt, likes: 0, liked: false, poll: null });
      closeModal();
      renderMain();
      showToast('تم نشر اللحظة!');
    }

    function toggleMomentLike(id) {
      const m = state.moments.find(x => x.id === id);
      if (!m) return;
      m.liked = !m.liked;
      m.likes += m.liked ? 1 : -1;
      renderMain();
    }

    function votePoll(momentId, idx) {
      const m = state.moments.find(x => x.id === momentId);
      if (!m || !m.poll || m.poll.votedIdx !== null) return;
      m.poll.votedIdx = idx;
      m.poll.options[idx].votes += 1;
      renderMain();
    }

    function openDmModal(dmId) {
      const dm = state.dms.find(x => x.id === dmId);
      if (!dm) return;
      dm.unread = 0;
      renderMain();
      openModal(`
        <div class="space-y-3">
          <div class="flex justify-between items-center border-b pb-2" style="border-color: var(--border-subtle);">
            <div class="flex items-center gap-2"><span class="text-xl">${dm.avatar}</span><h3 class="font-bold text-sm">${dm.name}</h3></div>
            <button onclick="closeModal()" class="p-1 rounded-full hover:bg-white/10"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <div id="dmMessages" class="space-y-2 max-h-56 overflow-y-auto p-1">
            ${dm.messages.map(msg => `
              <div class="flex ${msg.from === 'me' ? 'justify-start' : 'justify-end'}">
                <div class="px-3 py-1.5 rounded-2xl text-xs max-w-[80%] ${msg.from === 'me' ? 'theme-accent-bg' : 'theme-card border'}">${msg.text}</div>
              </div>
            `).join('')}
          </div>
          <form onsubmit="sendDmMsg(event, '${dm.id}')" class="flex gap-1.5">
            <input id="dmInput" required type="text" placeholder="اكتب رسالتك..." class="flex-1 px-3 py-2 rounded-full text-xs border theme-card focus:outline-none" />
            <button type="submit" class="px-4 py-2 rounded-full theme-accent-bg text-xs font-bold">إرسال</button>
          </form>
        </div>
      `);
    }

    function sendDmMsg(e, dmId) {
      e.preventDefault();
      const dm = state.dms.find(x => x.id === dmId);
      const inp = document.getElementById('dmInput');
      const txt = inp.value.trim();
      if (!dm || !txt) return;
      dm.messages.push({ from: 'me', text: txt });
      dm.lastMsg = txt;

const $room = id => document.getElementById(id);
const htmlText = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roomSessions = new Map();
let service = null, account = null, recovery = false, liveRoom = null, liveGeneration = 0, liveRole = '', pendingMic = false;
const previewKey = 'halaa.ad.v1';
const adDefaults = {enabled:true,start:null,end:null,imageIndex:Math.max(0,AD_IMAGES.indexOf(state.homeAd.bgImg))};
Object.assign(state.homeAd,adDefaults);
function applyAd(ad) {
  if (!ad || !['title','subtitle','badge','cta'].every(k=>typeof ad[k]==='string')) return;
  for(const k of ['title','subtitle','badge','cta','enabled','start','end','motion','effect','imageIndex']) if(k in ad) state.homeAd[k]=ad[k];
  if(AD_IMAGES[ad.imageIndex]) state.homeAd.bgImg=AD_IMAGES[ad.imageIndex];
}
function adVisible(now=Date.now()) {
  const a=state.homeAd;
  return a.enabled && (a.start==null || now>=a.start) && (a.end==null || now<a.end);
}
function dateInput(ms) {
  if(ms==null) return '';
  const d=new Date(ms);
  return new Date(ms-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
}
function scheduleAd() {
  clearTimeout(scheduleAd.timer);
  const next=[state.homeAd.start,state.homeAd.end].filter(n=>n!=null&&n>Date.now()).sort((a,b)=>a-b)[0];
  if(next!=null) scheduleAd.timer=setTimeout(()=>{if(state.activeTab==='home') renderMain();scheduleAd();},Math.min(next-Date.now()+10,2147483647));
}
async function api(path,data) {
  const session=(await account?.auth.getSession())?.data?.session;
  const response=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(session?.access_token||'')},body:JSON.stringify(data),signal:AbortSignal.timeout(12000)});
  const result=await response.json();
  if(!response.ok) throw Error(result.error||'تعذر إتمام الطلب');
  return result;
}
async function setupServices() {
  if(!['https:','http:'].includes(location.protocol)||window.top!==window.self)return;
  try {
    const r=await fetch('/api/config',{signal:AbortSignal.timeout(5000)});
    if(!r.ok || !r.headers.get('content-type')?.includes('application/json')) return;
    service=await r.json();
    for(const room of (service.rooms||[]).slice().reverse()){
      if(!/^room-[a-f0-9-]+$/.test(room.id)||state.rooms.some(r=>r.id===room.id))continue;
      state.rooms.unshift({...state.rooms[0],id:room.id,numId:room.id.slice(-6),title:room.title,category:room.category,tags:[room.category],listeners:0,host:'مالك الغرفة',isFav:false,discovery:'all',speaking:false});
    }
    if(state.activeTab==='home'||state.activeTab==='rooms') renderMain();
    if(service.ad){applyAd(service.ad);scheduleAd();if(state.activeTab==='home')renderMain();}
    if(!service.authUrl || !service.publicKey) return;
    const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm');
    account=createClient(service.authUrl,service.publicKey,{auth:{flowType:'pkce'}});
    account.auth.onAuthStateChange(event=>{
      if(event==='PASSWORD_RECOVERY') {recovery=true;setTimeout(()=>accountForm('new'),0);}
      if(event==='SIGNED_OUT'){recovery=false;stopLive();}
    });
  } catch { /* Offline previews keep their local controls. */ }
}
function accountForm(mode='login') {
  if(!account){
    openModal('<h3 class="font-bold">الحساب واستعادة كلمة المرور</h3><p class="py-4 theme-muted">استعادة الحساب بالبريد تتطلب اتصال النسخة بخدمة الحسابات. هذه الميزة غير متاحة على رابط المعاينة.</p><button class="control" onclick="closeModal()">إغلاق</button>');
    return;
  }
  const titles={login:'تسجيل الدخول',signup:'إنشاء حساب',reset:'نسيت كلمة المرور',new:'تعيين كلمة مرور جديدة'};
  const form=document.createElement('form');
  form.className='space-y-3';
  form.innerHTML='<h3 class="font-bold">'+titles[mode]+'</h3>'+(mode!=='new'?'<label>البريد الإلكتروني<input class="control" name="email" type="email" autocomplete="email" required dir="ltr"></label>':'')+(mode!=='reset'?'<label>كلمة المرور<input class="control" name="password" type="password" autocomplete="'+(mode==='login'?'current-password':'new-password')+'" minlength="'+(mode==='login'?1:10)+'" required></label>':'')+'<p role="status"></p><button class="control theme-accent-bg" type="submit">'+titles[mode]+'</button><button class="control" type="button" onclick="closeModal()">إغلاق</button>';
  if(mode==='login')account.auth.getSession().then(({data})=>{
    if(data.session&&form.isConnected){const logout=document.createElement('button');logout.className='control';logout.type='button';logout.textContent='تسجيل الخروج';logout.onclick=async()=>{const {error}=await account.auth.signOut();if(error){showToast('تعذّر الخروج');return;}closeModal();showToast('تم تسجيل الخروج');};form.append(logout);}
  });
  if(mode==='login') form.insertAdjacentHTML('beforeend','<button type="button" class="control" onclick="accountForm(\'reset\')">نسيت كلمة المرور؟</button><button type="button" class="control" onclick="accountForm(\'signup\')">إنشاء حساب</button>');
  openModal('');$room('modalContent').append(form);
  form.onsubmit=async e=>{
    e.preventDefault();const button=form.querySelector('[type=submit]'),msg=form.querySelector('[role=status]');
    button.disabled=true;
    try {
      const email=form.elements.email?.value.trim(),password=form.elements.password?.value;
      const redirectTo=location.origin+location.pathname;
      let result;
      if(mode==='reset')result=await account.auth.resetPasswordForEmail(email,{redirectTo});
      else if(mode==='login')result=await account.auth.signInWithPassword({email,password});
      else if(mode==='signup')result=await account.auth.signUp({email,password,options:{emailRedirectTo:redirectTo}});
      else {if(!recovery) throw Error();result=await account.auth.updateUser({password});}
      if(result.error)throw result.error;
      form.reset();
      if(mode==='reset'||mode==='signup')msg.textContent=mode==='reset'?'إذا كان البريد مرتبطًا بحساب فستصلك تعليمات الاستعادة.':'راجع بريدك لتأكيد الحساب.';
      else {recovery=false;closeModal();showToast(mode==='new'?'تم تغيير كلمة المرور':'تم تسجيل الدخول');}
    } catch {msg.textContent='تعذّر إتمام الطلب. تحقق من البيانات وصلاحية الرابط ثم حاول مجددًا.';}
    finally{button.disabled=false;}
  };
}
function stopLive() {
  liveGeneration++;
  const room=liveRoom;liveRoom=null;liveRole='';
  if(room) void room.disconnect();
  $room('liveAudio').replaceChildren();$room('livePanel').hidden=true;
  $room('voiceRoomOverlay').classList.remove('in-live');
}
async function connectLive() {
  if(!service?.voiceReady){showToast('البث الجماعي يتطلب اتصال النسخة بخادم الصوت');return;}
  if(!(await account?.auth.getSession())?.data.session){accountForm();return;}
  if(liveRoom)return;
  const roomId=state.activeRoom?.id,version=++liveGeneration;
  const status=$room('liveStatus');status.textContent='جارٍ الاتصال…';
  try {
    const [lk,join]=await Promise.all([import('https://cdn.jsdelivr.net/npm/livekit-client@2.15.6/+esm'),api('voice',{room:roomId})]);
    if(version!==liveGeneration)return;
    const room=new lk.Room(); liveRoom=room;liveRole=join.role;
    const paint=()=>{if(liveRoom===room)renderLive();};
    for(const event of ['participantConnected','participantDisconnected','activeSpeakersChanged','trackMuted','trackUnmuted','participantPermissionsChanged','participantMetadataChanged','reconnected'])room.on(event,paint);
    room.on('reconnecting',()=>{if(room===liveRoom)$room('liveStatus').textContent='جارٍ إعادة الاتصال…';});
    room.on('trackSubscribed',track=>{if(room===liveRoom&&track.kind==='audio')$room('liveAudio').append(track.attach());});
    room.on('trackUnsubscribed',track=>track.detach().forEach(el=>el.remove()));
    room.on('dataReceived',(bytes,p,kind,topic)=>{
      if(room!==liveRoom||!p||topic!=='room-chat'||bytes.length>1600)return;
      appendLiveMessage(p.name||'عضو',new TextDecoder().decode(bytes));
    });
    room.on('disconnected',()=>{if(room===liveRoom){stopLive();status.textContent='انقطع الاتصال';}});
    await room.connect(join.url,join.token);
    if(version!==liveGeneration){await room.disconnect();return;}
    $room('voiceRoomOverlay').classList.add('in-live');$room('livePanel').hidden=false;
    await room.startAudio().catch(()=>{});paint();
  } catch(err){if(version===liveGeneration){stopLive();status.textContent=err.message||'تعذر الاتصال';}}
}
function appendLiveMessage(sender,text) {
  const entry=document.createElement('p');entry.textContent=sender+' · '+text.slice(0,350);
  const log=$room('liveLog');log.append(entry);if(log.children.length>80)log.firstChild.remove();log.scrollTop=log.scrollHeight;
}
async function liveSend(form){
  const room=liveRoom,text=form.elements.message.value.trim();
  if(!room||!text)return;
  try{await room.localParticipant.publishData(new TextEncoder().encode(text),{reliable:true,topic:'room-chat'});if(room===liveRoom){appendLiveMessage('أنت',text);form.reset();}}catch{showToast('تعذّر إرسال الرسالة');}
}
function renderLive() {
  const room=liveRoom;if(!room)return;
  try{liveRole=JSON.parse(room.localParticipant.metadata||'{}').role||liveRole;}catch{}
  const people=[room.localParticipant,...room.remoteParticipants.values()];
  const roles={owner:'المالك',moderator:'مشرف',speaker:'متحدث',listener:'مستمع'};
  $room('liveStatus').textContent='متصل · '+people.length+' أعضاء · '+(roles[liveRole]||'مستمع');
  const grid=$room('livePeople');grid.replaceChildren();
  for(const p of people){
    const el=document.createElement('div');el.className='voice-person'+(p.isSpeaking?' speaking':'');
    const name=document.createElement('b');name.textContent=p===room.localParticipant?'أنت':p.name||'عضو';
    const detail=document.createElement('small');detail.textContent=p.isSpeaking?'يتحدث الآن':p.isMicrophoneEnabled?'الميكروفون مفتوح':'يستمع';
    el.append(name,detail);
    if(p!==room.localParticipant&&['owner','moderator'].includes(liveRole)){
      for(const [action,label] of [['mute','كتم'],['remove','إخراج'],...(p.permissions?.canPublish?[['listener','نقل للاستماع']]:[['speaker','منح الميكروفون']])]){
        const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{await api('moderate',{room:state.activeRoom.id,target:p.identity,action});}catch(e){showToast(e.message);}};el.append(b);
      }
    }
    grid.append(el);
  }
  const mic=$room('liveMic');mic.disabled=pendingMic||!room.localParticipant.permissions?.canPublish;
  mic.textContent=room.localParticipant.isMicrophoneEnabled?'كتم الميكروفون':'فتح الميكروفون';
}
async function liveMicToggle(){
  const room=liveRoom;if(!room||pendingMic||!room.localParticipant.permissions?.canPublish)return;
  pendingMic=true;renderLive();
  try{await room.localParticipant.setMicrophoneEnabled(!room.localParticipant.isMicrophoneEnabled,{echoCancellation:true,noiseSuppression:true,autoGainControl:true});}
  catch{showToast('تحقق من إذن الميكروفون في المتصفح');}finally{pendingMic=false;renderLive();}
}
window.addEventListener('pagehide',stopLive);

function roomPolicy(room=state.activeRoom){
  return room.previewPolicy ||= {voice:true,chat:true,reactions:true};
}
function openRoomPolicy(){
  if(!state.activeRoom)return;
  const flags=roomPolicy();
  openModal('<h3 class="font-bold">صلاحيات غرفة المعاينة</h3><div class="space-y-3 py-4">'+Object.entries({voice:'صعود المقاعد',chat:'الرسائل والوسائط',reactions:'التفاعلات'}).map(([key,label])=>'<label class="control flex justify-between">'+label+'<input type="checkbox" data-policy="'+key+'" '+(flags[key]?'checked':'')+'></label>').join('')+'</div><button class="control" onclick="closeModal()">تم</button>');
  for(const el of $room('modalContent').querySelectorAll('[data-policy]')){
    el.onchange=()=>{
      flags[el.dataset.policy]=el.checked;
      if(!flags.voice){const me=state.mics.find(m=>m.isMe);if(me)clickMic(me.index);}
      syncRoomPolicy();
    };
  }
}
function syncRoomPolicy(){
  if(!state.activeRoom)return;
  const p=roomPolicy();$room('roomChatInput').disabled=!p.chat;
  $room('roomChatInput').placeholder=p.chat?'اكتب رسالة للغرفة…':'الدردشة مغلقة لهذه الغرفة';
}


// Init
    setInterval(() => { state.serverEpochMs += 1000; }, 1000);
    window.addEventListener('DOMContentLoaded', () => {
      try { applyAd(JSON.parse(localStorage.getItem(previewKey))); } catch {}
      scheduleAd();setupServices();
      updateWalletUI();
      switchTab('home');
    });
  </script>
</body>
