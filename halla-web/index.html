<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هلاا — غرف الدردشة الصوتية والألعاب</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #04080a;
      --bg-surface: #091318;
      --bg-card: #0f1e25;
      --bg-card-hover: #152932;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10d8be;
      --accent-dark: #059684;
      --gold: #f6cb5c;
      --border-subtle: rgba(246, 203, 92, 0.24);
    }
    [data-theme="dark-gold"] {
      --bg-app: #070709;
      --bg-surface: #101014;
      --bg-card: #18181f;
      --bg-card-hover: #22222c;
      --text-main: #faf8f5;
      --text-muted: #a8a29e;
      --accent: #f6cb5c;
      --accent-dark: #ca8a04;
      --gold: #fde047;
      --border-subtle: rgba(246, 203, 92, 0.28);
    }
    [data-theme="cyber-night"] {
      --bg-app: #060714;
      --bg-surface: #0d1026;
      --bg-card: #151a3a;
      --bg-card-hover: #1e2550;
      --text-main: #f8fafc;
      --text-muted: #a5b4fc;
      --accent: #38bdf8;
      --accent-dark: #6366f1;
      --gold: #f5c451;
      --border-subtle: rgba(56, 189, 248, 0.25);
    }
    [data-theme="royal-pearl"] {
      --bg-app: #f4f1ea;
      --bg-surface: #fffdf9;
      --bg-card: #f8f4ec;
      --bg-card-hover: #efe8d8;
      --text-main: #1c1917;
      --text-muted: #57534e;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --gold: #b45309;
      --border-subtle: rgba(180, 83, 9, 0.22);
    }

    body {
      font-family: 'Cairo', 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .theme-surface { background-color: color-mix(in srgb, var(--bg-surface) 84%, transparent); backdrop-filter: blur(14px); border-color: var(--border-subtle); }
    @keyframes luxuryBgDrift {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.08) translate(-1.5%, -1%); }
      100% { transform: scale(1) translate(0, 0); }
    }
    @keyframes luxuryBgWave { 0%, 100% { transform: scale(1.04) translate(0, 0) rotate(0deg); filter: brightness(1); } 50% { transform: scale(1.12) translate(-2%, 1%) rotate(0.6deg); filter: brightness(1.18); } }
    .luxury-bg-motion { animation: luxuryBgDrift 18s ease-in-out infinite; }
    .luxury-bg-wave { animation: luxuryBgWave 12s ease-in-out infinite; }
    .theme-card { background-color: color-mix(in srgb, var(--bg-card) 82%, transparent); backdrop-filter: blur(10px); border-color: var(--border-subtle); }
    .theme-card:hover { background-color: color-mix(in srgb, var(--bg-card-hover) 90%, transparent); }
    .theme-muted { color: var(--text-muted); }
    .theme-accent-bg { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #061316; }
    .theme-accent-text { color: var(--accent); }
    .theme-gold-text { color: var(--gold); }

    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 212, 184, 0.65); }
      70% { box-shadow: 0 0 0 10px rgba(0, 212, 184, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 212, 184, 0); }
    }
    .mic-speaking {
      box-shadow: 0 0 0 2px var(--accent);
      border-color: var(--accent) !important;
    }

    @keyframes giftFloat {
      0% { transform: translateY(20px) scale(0.8); opacity: 0; }
      15% { transform: translateY(0) scale(1.05); opacity: 1; }
      85% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-20px) scale(0.95); opacity: 0; }
    }
    @keyframes luxuryGiftStage {
      0% { transform: scale(0.4) translateY(30px); opacity: 0; }
      20% { transform: scale(1.12) translateY(0); opacity: 1; }
      75% { transform: scale(1) translateY(-4px); opacity: 1; }
      100% { transform: scale(0.9) translateY(-24px); opacity: 0; }
    }
    .luxury-gift-stage {
      animation: luxuryGiftStage 3.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes gift4DSpin {
      0% { transform: perspective(900px) rotateY(-180deg) scale(0.3); opacity: 0; }
      25% { transform: perspective(900px) rotateY(15deg) scale(1.22); opacity: 1; }
      65% { transform: perspective(900px) rotateY(-8deg) scale(1.1); opacity: 1; }
      100% { transform: perspective(900px) rotateY(360deg) scale(0.85); opacity: 0; }
    }
    @keyframes shockwave4D {
      0% { transform: scale(0.4); opacity: 0.9; }
      100% { transform: scale(2.8); opacity: 0; }
    }
    @keyframes gift3DSmooth {
      0% { transform: perspective(900px) rotateY(-45deg) scale(0.5); opacity: 0; }
      20% { transform: perspective(900px) rotateY(15deg) scale(1.08); opacity: 1; }
      55% { transform: perspective(900px) rotateY(-12deg) scale(1.04); opacity: 1; }
      100% { transform: perspective(900px) rotateY(25deg) scale(0.92); opacity: 0; }
    }
    @keyframes gift4DUltra {
      0% { transform: perspective(1000px) rotateY(-180deg) rotateX(15deg) scale(0.35); opacity: 0; }
      20% { transform: perspective(1000px) rotateY(20deg) rotateX(-5deg) scale(1.15); opacity: 1; }
      55% { transform: perspective(1000px) rotateY(-18deg) rotateX(5deg) scale(1.08); opacity: 1; }
      85% { transform: perspective(1000px) rotateY(10deg) scale(1.02); opacity: 1; }
      100% { transform: perspective(1000px) rotateY(360deg) scale(0.85); opacity: 0; }
    }
    .gift-4d-icon {
      animation: gift4DUltra 3.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transform-style: preserve-3d;
    }
    .shockwave-ring {
      animation: shockwave4D 1.3s ease-out infinite;
    }
    @keyframes adZoom { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes adFade { 0%,100% { opacity: 1; } 50% { opacity: 0.72; } }
    @keyframes adPulseGlow { 0%,100% { box-shadow: 0 0 18px rgba(245,196,81,0.35); } 50% { box-shadow: 0 0 36px rgba(245,196,81,0.85); } }
    @keyframes adShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
    .ad-motion-zoom img.ad-bg { animation: adZoom 10s ease-in-out infinite; }
    .ad-motion-fade { animation: adFade 4s ease-in-out infinite; }
    .ad-motion-pulse { animation: adPulseGlow 2.4s ease-in-out infinite; }
    .ad-effect-gold { box-shadow: 0 0 28px rgba(245,196,81,0.45); border-color: rgba(245,196,81,0.75) !important; }
    .ad-effect-diamond { box-shadow: 0 0 28px rgba(16,216,190,0.45); border-color: rgba(16,216,190,0.75) !important; }
    .ad-shimmer-bar { position: absolute; inset: 0; width: 45%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent); animation: adShimmer 3.2s infinite; pointer-events: none; }
    @keyframes roomMarquee {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .room-marquee-text {
      display: inline-block;
      white-space: nowrap;
      animation: roomMarquee 18s linear infinite;
    }
    @keyframes petFloatAura {
      0%, 100% { transform: translateY(0px) scale(1); box-shadow: 0 0 14px rgba(245,196,81,0.35); }
      50% { transform: translateY(-4px) scale(1.04); box-shadow: 0 0 26px rgba(16,216,190,0.75); }
    }
    .pet-animated-aura { animation: petFloatAura 2.6s ease-in-out infinite; }
    .luxury-gold-gradient {
      background: linear-gradient(135deg, #fde68a 0%, #f59e0b 50%, #d97706 100%);
      color: #111827;
    }
    .gift-banner-anim {
      animation: giftFloat 3s ease forwards;
    }

    @keyframes eqBar {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }
    .eq-bar { width: 3px; border-radius: 99px; background: var(--accent); animation: none; }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* === HALAA v3 LUXURY COMPACT CARDS, LIGHT THEME FIX & ANIMATIONS === */
    /* Compact, super-clear boxes for Rooms, Games & Store */
    .lounge-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }
    @media (min-width: 640px) {
      .lounge-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
    }
    @media (min-width: 960px) {
      .lounge-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
      }
    }
    .lounge-tile {
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: color-mix(in srgb, var(--bg-card) 88%, transparent);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .lounge-tile:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--gold) 60%, transparent);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
    }
    .lounge-art {
      aspect-ratio: 1.48 !important;
    }
    .lounge-name {
      margin: 5px 6px 2px !important;
      font-size: clamp(10.5px, 2.3vw, 12.5px) !important;
      line-height: 1.32 !important;
      height: 2.64em !important;
      font-weight: 800;
      color: var(--text-main);
    }
    .lounge-info {
      padding: 0 6px 6px !important;
      font-size: 10px;
    }
    .lounge-count {
      font-size: 10px !important;
      padding: 2px 5px !important;
      top: 4px !important;
    }
    .lounge-fav {
      top: 4px !important;
      padding: 4px !important;
    }

    /* Game Auto-Cycling Crossfade Slideshow (2.5s, Flicker-Free) */
    .game-slide-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a1419;
    }
    .game-slide-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transform: scale(1);
      transition: opacity 0.55s ease, transform 2.6s ease;
      pointer-events: none;
    }
    .game-slide-img.active {
      opacity: 1;
      transform: scale(1.06);
    }
    .game-slide-dots {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 3px;
      z-index: 4;
      background: rgba(0, 0, 0, 0.45);
      padding: 2px 5px;
      border-radius: 999px;
    }
    .game-slide-dot {
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.45);
      transition: width 0.25s ease, background-color 0.25s ease;
    }
    .game-slide-dot.active {
      width: 11px;
      background: var(--gold);
    }

    /* Bottom Navigation Edge-Fade & Safe Area */
    nav.halaa-nav-v3 {
      padding-bottom: max(6px, env(safe-area-inset-bottom)) !important;
    }
    .nav-edge-fade {
      -webkit-mask-image: linear-gradient(to left, transparent 0%, black 8%, black 92%, transparent 100%);
      mask-image: linear-gradient(to left, transparent 0%, black 8%, black 92%, transparent 100%);
    }

    /* Royal Pearl Light Theme Full Readability Polish */
    [data-theme="royal-pearl"] .theme-surface {
      background-color: rgba(255, 253, 249, 0.90) !important;
      color: #1c1917;
    }
    [data-theme="royal-pearl"] .theme-card {
      background-color: rgba(248, 244, 236, 0.92) !important;
      color: #1c1917;
    }
    [data-theme="royal-pearl"] #appBgLayerImg {
      opacity: 0.16 !important;
    }
    [data-theme="royal-pearl"] .bg-black\/30,
    [data-theme="royal-pearl"] .bg-black\/40 {
      background-color: rgba(28, 25, 23, 0.08) !important;
    }

    /* Voice Room Animated Canvas Layer */
    #roomThemeCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.85;
    }

</style>

    <img id="appBgLayerImg" src="assets/8ce1e9d39f18851989b04b60e94b9ececb0ca3090f4db04fd5ad08783897437e.jpg" alt="" class="luxury-bg-motion absolute inset-0 w-full h-full object-cover opacity-35 pointer-events-none" />

      else document.documentElement.setAttribute('data-theme', t.id);
      const bgEl = document.getElementById('appBgLayerImg');
      if (bgEl) bgEl.src = t.bg;
      openThemesModal();
      showToast('تم تفعيل ثيم: ' + t.name);

    function cycleTheme() {
      state.themeIndex = (state.themeIndex + 1) % state.themes.length;
      const t = state.themes[state.themeIndex];
      if (t.id === 'default') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', t.id);
      }
      showToast('الثيم الحالي: ' + t.name);

    function buyUnifiedStoreItem(source, id) {
      if (source === 'vip') {
        const item = state.storeItems.find(x => x.id === id);
        if (!item || item.owned) return;
        if (state.user.gold < item.price) { showToast('رصيد الذهب غير كافٍ'); return; }
        state.user.gold -= item.price;
        item.owned = true;
        if (item.type === 'إطار') {
          state.user.frame = item.name;
          state.user.frameEffect = 'turquoise';
        }
        if (item.type === 'VIP') state.user.vip = 'الفارس';
        updateWalletUI();
        renderMain();
        showToast(`تم شراء وتفعيل ${item.name}!`);
      } else {
        const item = state.gamesStoreItems.find(x => x.id === id);
        if (!item || item.owned) return;
        if (state.user.gold < item.price) { showToast('رصيد الذهب غير كافٍ'); return; }
        state.user.gold -= item.price;
        item.owned = true;
        updateWalletUI();
        renderMain();
        showToast(`تم اقتناء وتفعيل ${item.name}!`);
      }
    }

    function formatRemainingServerTime(expiresAtMs) {
      if (!expiresAtMs || expiresAtMs <= state.serverEpochMs) return 'غير مشترك';
      const diff = expiresAtMs - state.serverEpochMs;
      const days = Math.floor(diff / 86400000);
      const hrs = Math.floor((diff % 86400000) / 3600000);
      return `متبقي ${days} يوم و ${hrs} ساعة`;
    }

    function subscribeBadgeDays(badgeId, days, price) {
      const b = state.badgeSubscriptions.find(x => x.id === badgeId);
      if (!b) return;
      if (state.user.gold < price) { showToast('رصيد الذهب غير كافٍ للاشتراك'); return; }
      state.user.gold -= price;
      const base = (b.expiresAtMs && b.expiresAtMs > state.serverEpochMs) ? b.expiresAtMs : state.serverEpochMs;
      b.expiresAtMs = base + days * 86400000;
      updateWalletUI();
      if (state.activeTab === 'me') renderMain();
      openBadgesModal();
      showToast(`تم تفعيل «${b.name}» لمدة ${days} يوماً بتوقيت السيرفر!`);
    }

    // --- Voice Room Logic ---
    function enterRoom(roomId) {
      const room = state.rooms.find(r => r.id === roomId);
      if (!room) return;
      if(state.activeRoom) rememberRoom();
      stopLive();$room('liveLog').replaceChildren();$room('liveStatus').textContent='معاينة المقاعد';
      state.activeRoom = room;syncRoomPolicy();$room('seatRoomBadge').innerHTML=badgeChip(...roomBadge(room));if(!collection.visits.includes(room.id)){collection.visits.push(room.id);saveCollection();}
      state.eventTasks.roomJoined = true;
      const visitKey=localDay()+'/'+room.id;
      if(!visitedToday.includes(visitKey)){visitedToday=visitedToday.filter(k=>k.startsWith(localDay()+'/'));visitedToday.push(visitKey);addXP(10,'زيارة غرفة');}
      state.isRoomMinimized = false;
      document.getElementById('floatingRoomBubble').classList.add('hidden');
      document.getElementById('voiceRoomOverlay').classList.remove('hidden');

      document.getElementById('roomFlagBadge').textContent = room.flag;
      document.getElementById('roomTitleText').textContent = room.title;
      document.getElementById('roomIdText').textContent = 'ID: ' + room.numId;
      document.getElementById('roomListenerCount').textContent = room.listeners;
      document.getElementById('floatingRoomTitle').textContent = room.title;
      const bgEl = document.getElementById('roomBgImage');
      if (bgEl) bgEl.src = room.cover || 'assets/8ce1e9d39f18851989b04b60e94b9ececb0ca3090f4db04fd5ad08783897437e.jpg';
      const hp = document.getElementById('roomHeaderPhoto');
      if (hp) hp.src = room.cover || 'assets/0bbde3a00e75fc0ed7f897404c1c7d607b8f986418371267b042de0384b27ef9.jpg';
      const rb = document.getElementById('roomLevelBadge'); if (rb) rb.textContent = 'Lv.' + state.roomLevel;
      const tk = document.getElementById('roomTickerText');
      if (tk) tk.textContent = state.adminControl.roomAnnouncement;

      state.seatMode=state.adminControl.defaultMicLimit || 8;
      initMics(state.seatMode);
      state.roomChats = [
        { sender: 'النظام', text: state.adminControl.roomAnnouncement, isSystem: true },
        { sender: room.host, text: 'حياكم الله جميعاً! المايكات مفتوحة للمشاركة 🎙️', isSystem: false },
        { sender: 'الأمير خالد', text: 'منورين المجلس، الجو اليوم ممتاز 🔥', isSystem: false }
      ];
      const saved=roomSessions.get(room.id);
      if(saved){state.roomChats=saved.chats;state.seatMode=saved.count;state.mics=saved.mics;}
      $room('seatModeLabel').textContent=state.seatMode+' مايك';
      $room('roomTickerText').textContent=room.announcement||state.adminControl.roomAnnouncement;
      renderMics();
      renderRoomChats();
      lucide.createIcons();
    }

    function getMicRequiredLevel(idx) {
      if (idx < 8) return 1;
      if (idx < 10) return 15;
      return 25;
    }

    function initMics(count) {
      const sampleHosts = [
        { name: state.activeRoom.host, avatar: '🎙️', flag: '🇸🇦', gender: 'M', speaking: true, muted: false },
        { name: 'الأمير خالد', avatar: '🦁', flag: '🇸🇦', gender: 'M', speaking: false, muted: false },
        { name: 'سارة ✨', avatar: '💎', flag: '🇸🇦', gender: 'F', speaking: true, muted: false }
      ];
      state.mics = Array.from({ length: count }, (_, i) => {
        const reqLv = getMicRequiredLevel(i);
        const locked = state.roomLevel < reqLv;
        if (i < sampleHosts.length) return { index: i, occupied: true, locked: false, reqLv, ...sampleHosts[i], isMe: false };
        return { index: i, occupied: false, locked, reqLv, name: 'مقعد ' + (i + 1), avatar: '', speaking: false, muted: false, isMe: false };
      });
    }

    function cycleSeatCount() {
      const modes = [8, 10, 12];
      const next = modes[(modes.indexOf(state.seatMode) + 1) % modes.length];
      state.seatMode = next;
      document.getElementById('seatModeLabel').textContent = next + ' مايك';
      initMics(next);
      renderMics();
      showToast(`تم تحويل الغرفة إلى ${next} مقاعد`);
    }

    function renderMics() {
      const grid = document.getElementById('micGrid');
      grid.className = 'grid grid-cols-4 sm:grid-cols-5 gap-2.5 max-w-2xl mx-auto';
      grid.innerHTML = state.mics.map(m => {
        if (m.locked) {
          return `
            <button onclick="clickMic(${m.index})" class="flex flex-col items-center gap-1 opacity-75">
              <div class="w-14 h-14 rounded-full border-2 border-amber-400/35 bg-black/50 flex flex-col items-center justify-center">
                <i data-lucide="lock" class="w-4 h-4 theme-gold-text"></i>
                <span class="text-[8px] theme-gold-text font-bold">Lv.${m.reqLv}</span>
              </div>
              <span class="text-[10px] theme-muted">مغلق</span>
            </button>
          `;
        }
        if (!m.occupied) {
          return `
            <button onclick="clickMic(${m.index})" class="flex flex-col items-center gap-1 group">
              <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full border border-white/25 bg-white/15 backdrop-blur-sm flex items-center justify-center">
                <i data-lucide="mic" class="w-5 h-5 text-white/80"></i>
              </div>
              <span class="text-[10px] theme-muted">${m.index + 1}</span>
            </button>
          `;
        }
        return `
          <button onclick="clickMic(${m.index})" class="flex flex-col items-center gap-1 relative">
            <div class="w-14 h-14 rounded-full border-2 ${m.speaking && !m.muted ? 'mic-speaking' : 'border-white/20'} bg-slate-800/80 flex items-center justify-center text-2xl relative shadow-md">
              ${m.isMe ? `<img src="${state.user.avatarImg}" class="w-full h-full rounded-full object-cover" />` : `<span>${m.avatar}</span>`}
              ${m.muted ? '<span class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-rose-500 flex items-center justify-center"><i data-lucide="mic-off" class="w-3 h-3 text-white"></i></span>' : ''}
            </div>
            <span class="text-[11px] font-bold truncate max-w-[74px] ${m.isMe ? 'theme-accent-text' : ''}">${m.flag || '🇸🇦'} ${m.gender === 'F' ? '♀' : '♂'} ${m.name}</span>${m.isMe?ownBadge():""}
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    function clickMic(idx) {
      const mic = state.mics[idx];
      if(!mic)return;
      if(!mic.occupied&&!roomPolicy().voice){showToast("صعود المقاعد مغلق في هذه الغرفة");return;}
      if (mic.locked) { showToast(`هذا المايك يفتح عند وصول الغرفة إلى المستوى Lv.${mic.reqLv}`); return; }
      if (!mic.occupied) {
        // Leave any previous mic I occupy
        state.mics.forEach(m => {
          if (m.isMe) { m.occupied = false; m.isMe = false; m.name = 'مقعد ' + (m.index + 1); }
        });
        mic.occupied = true;
        mic.isMe = true;
        mic.name = 'أنت';
        mic.avatar = state.user.avatar;
        mic.speaking = true;
        mic.muted = false;
        renderMics();
        showToast('صعدت على المايك رقم ' + (idx + 1));
      } else if (mic.isMe) {
        mic.occupied = false;
        mic.isMe = false;
        mic.speaking = false;
        mic.name = 'مقعد ' + (idx + 1);
        renderMics();
        showToast('نزلت من المايك');
      } else {
        openMicUserSheet(mic);
      }
    }

      const reader = new FileReader();

        if (gm) { gm.img = ev.target.result; showToast('تم تحديث صورة لعبة: ' + gm.name); }

      reader.readAsDataURL(file);
    }

    function uploadCustomAppImg(e, target) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const dataUrl = ev.target.result;
        if (target === 'avatar') {
          state.user.avatarImg = dataUrl;
          const ha = document.getElementById('headerUserAvatarImg');
          if (ha) ha.src = dataUrl;
          showToast('تم تحديث الصورة الشخصية بنجاح!');
        } else if (target === 'festival') {
          state.festivalImg = dataUrl;
          showToast('تم تحديث صورة مهرجان الأحداث بنجاح!');
        }
      };
      reader.readAsDataURL(file);
    }

      e.preventDefault();
      const localTime=id=>$room(id).value ? new Date($room(id).value).getTime() : null;
      const ad={enabled:$room('adEnabled').checked,start:localTime('adStart'),end:localTime('adEnd'),
        motion:$room('adMotionSel').value,effect:$room('adEffectSel').value,imageIndex:Number($room('adBgSel').value)};
      for(const [key,id] of Object.entries({title:'adTitleInp',subtitle:'adSubInp',cta:'adCtaInp',badge:'adBadgeInp'}))ad[key]=$room(id).value.trim();
      if(!ad.title||!ad.cta||!ad.subtitle||!ad.badge||[ad.title,ad.cta,ad.subtitle,ad.badge].some(t=>t.length>180)){showToast('اكتب نصوص الإعلان بحد أقصى 180 حرفًا للحقل');return;}
      if(ad.start!=null&&ad.end!=null&&ad.start>=ad.end){showToast('موعد النهاية يجب أن يكون بعد البداية');return;}
      try{
        if(service)await api('ad',ad);
        else localStorage.setItem(previewKey,JSON.stringify(ad));
        applyAd(ad);scheduleAd();showToast(service?'تم حفظ الإعلان':'تم حفظ الإعلان في هذا المتصفح');

      };
      if(!title || title.length>64){showToast('أدخل اسمًا بين حرف و64 حرفًا');return;}
      if(service){

async function connectLive() {
  if(!service?.voiceReady){showToast('البث الجماعي يتطلب اتصال النسخة بخادم الصوت');return;}
  if(!(await account?.auth.getSession())?.data.session){accountForm();return;}
  if(liveRoom)return;
  const roomId=state.activeRoom?.id,version=++liveGeneration;
  const status=$room('liveStatus');status.textContent='جارٍ الاتصال…';
  try {
    const [lk,join]=await Promise.all([import('https://cdn.jsdelivr.net/npm/livekit-client@2.15.6/+esm'),api('voice',{room:roomId})]);
    if(version!==liveGeneration)return;
    const room=new lk.Room(); liveRoom=room;liveRole=join.role;
    const paint=()=>{if(liveRoom===room)renderLive();};
    for(const event of ['participantConnected','participantDisconnected','activeSpeakersChanged','trackMuted','trackUnmuted','participantPermissionsChanged','participantMetadataChanged','reconnected'])room.on(event,paint);
    room.on('reconnecting',()=>{if(room===liveRoom)$room('liveStatus').textContent='جارٍ إعادة الاتصال…';});
    room.on('trackSubscribed',track=>{if(room===liveRoom&&track.kind==='audio')$room('liveAudio').append(track.attach());});
    room.on('trackUnsubscribed',track=>track.detach().forEach(el=>el.remove()));
    room.on('dataReceived',(bytes,p,kind,topic)=>{
      if(room!==liveRoom||!p)return;
      if(topic==='room-gift'||topic==='gift-applause'){receiveGift(topic,bytes,p);return;}
      if(topic!=='room-chat'||bytes.length>1600)return;
      appendLiveMessage(p.name||'عضو',new TextDecoder().decode(bytes));
    });
    room.on('disconnected',()=>{if(room===liveRoom){stopLive();status.textContent='انقطع الاتصال';}});
    await room.connect(join.url,join.token);
    if(version!==liveGeneration){await room.disconnect();return;}
    $room('voiceRoomOverlay').classList.add('in-live');$room('livePanel').hidden=false;
    await room.startAudio().catch(()=>{});paint();
  } catch(err){if(version===liveGeneration){stopLive();status.textContent=err.message||'تعذر الاتصال';}}
}

function makeVoiceProcessor(mode){
  let nodes=[],context,owned=false;
  return {
    name:'halaa-voice',
    async init({track,audioContext}){
      owned=!audioContext;context=audioContext||new AudioContext();
      await context.resume();
      const src=context.createMediaStreamSource(new MediaStream([track]));
      const out=context.createMediaStreamDestination();
      nodes=[src,out];this.processedTrack=out.stream.getAudioTracks()[0];
      if(mode==='studio'){
        const cut=context.createBiquadFilter();cut.type='highpass';cut.frequency.value=85;
        const eq=context.createBiquadFilter();eq.type='peaking';eq.frequency.value=2600;eq.gain.value=2.5;
        const compressor=context.createDynamicsCompressor();compressor.ratio.value=3;
        src.connect(cut).connect(eq).connect(compressor).connect(out);nodes.push(cut,eq,compressor);
      }else{
        const delay=context.createDelay(.3);delay.delayTime.value=.13;
        const wet=context.createGain();wet.gain.value=.18;
        const dry=context.createGain();dry.gain.value=.82;
        src.connect(dry).connect(out);src.connect(delay).connect(wet).connect(out);nodes.push(delay,wet,dry);
      }
    },
    async restart(options){await this.destroy();await this.init(options);},
    async destroy(){for(const node of nodes)node.disconnect();nodes=[];this.processedTrack?.stop();this.processedTrack=undefined;if(owned&&context&&context.state!=='closed')await context.close();}
  };
}
async function applyLiveVoice(select){
  const track=liveRoom?.localParticipant.getTrackPublication('microphone')?.track;
  if(!track||!liveRoom.localParticipant.isMicrophoneEnabled){select.value='natural';showToast('افتح الميكروفون أولاً');return;}
  select.disabled=true;
  try{if(select.value==='natural')await track.stopProcessor();else await track.setProcessor(makeVoiceProcessor(select.value));}
  catch{await track.stopProcessor().catch(()=>{});select.value='natural';showToast('تعذّر تشغيل المؤثر في هذا المتصفح');}
  finally{select.disabled=false;}
}

function chime(g){
  if(!collection.sound||!state.roomSoundEnabled||state.quietMode)return;
  try{
    const ctx=giftContext||=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')void ctx.resume().catch(()=>{});
    giftThemes[g.id].notes.forEach((hz,i)=>{
      const osc=ctx.createOscillator(),amp=ctx.createGain(),start=ctx.currentTime+i*.095;
      osc.type=g.id==='g2'?'triangle':'sine';osc.frequency.value=hz;
      amp.gain.setValueAtTime(.0001,start);amp.gain.exponentialRampToValueAtTime(.052,start+.022);
      amp.gain.exponentialRampToValueAtTime(.0001,start+.48);osc.connect(amp);amp.connect(ctx.destination);
      osc.onended=()=>{osc.disconnect();amp.disconnect();};osc.start(start);osc.stop(start+.5);
    });
  }catch{}
}
let onStage=null,stageTimer=0,applause=0;
function clearStage(){clearTimeout(stageTimer);onStage=null;const area=$room('giftBannerArea');if(area)area.replaceChildren();}
function showStage(g,sender,target,id){
  clearStage();onStage=id;applause=0;const t=giftThemes[g.id],el=document.createElement('div');
  el.className='gift-stage';el.style.setProperty('--glow',t.ink);
  el.innerHTML='<div class="gift-portrait perform '+t.scene+'"><img src="'+g.img+'" alt=""></div><div class="stage-copy"><small>'+htmlText(sender)+' أهدى '+htmlText(target)+'</small><strong>'+htmlText(g.name)+'</strong><span>'+htmlText(g.tier)+'</span></div><button class="control" aria-label="تفاعل مع الهدية">👏 <b>0</b></button>';

  el.record=who=>{if(!reactions.has(who)){reactions.add(who);el.querySelector('button b').textContent=String(++applause);}};

async function sendGift(giftId,targetName){
  const g=state.gifts.find(x=>x.id===giftId),room=state.activeRoom,session=liveRoom;
  if(!room||!g||giftPending||state.user.gold<g.price)return;
  const id=crypto.randomUUID();giftPending=true;const btn=$room('giftConfirm');if(btn)btn.disabled=true;
  try{
    if(session)await session.localParticipant.publishData(new TextEncoder().encode(JSON.stringify({giftId,id,target:targetName})),{reliable:true,topic:'room-gift'});
    state.user.gold-=g.price;state.eventTasks.giftSent=true;collection.sent++;saveCollection();addXP(25,'إرسال هدية');updateWalletUI();
    const me=state.leaderboard.find(x=>x.name==='أنت');if(me)me.amount+=g.price;else state.leaderboard.push({name:'أنت',avatar:state.user.avatar,amount:g.price});state.leaderboard.sort((a,b)=>b.amount-a.amount);
    if(room!==state.activeRoom||session!==liveRoom)return;
    closeModal();const line='أهدى '+g.name+' إلى '+targetName;
    if(session)appendLiveMessage('أنت',line);else{state.roomChats.push({sender:'أنت',text:line});renderRoomChats();}
    showStage(g,'أنت',targetName,id);
  }catch{showToast('تعذر إرسال الهدية، أعد المحاولة');}finally{giftPending=false;if(btn?.isConnected)paintGift();}
}
function receiveGift(topic,bytes,p){
  if(bytes.length>600||!p)return;
  try{const data=JSON.parse(new TextDecoder().decode(bytes));
    if(typeof data.id!=='string'||data.id.length>64)return;
    if(topic==='gift-applause'){if(onStage===data.id)$room('giftBannerArea').firstChild?.record(p.identity);return;}
    const g=state.gifts.find(x=>x.id===data.giftId);
    if(!g||typeof data.target!=='string'||data.target.length>80||giftHistory.has(data.id))return;
    if(giftHistory.size>=128)giftHistory.delete(giftHistory.keys().next().value);
    giftHistory.set(data.id,true);appendLiveMessage(p.name||'عضو','أهدى '+g.name+' إلى '+data.target);
    showStage(g,p.name||'عضو',data.target,data.id);
  }catch{}
}

function restorePersonal(){
  try{
    const p=JSON.parse(localStorage.getItem(profileKey)||'null');
    if(p&&typeof p.name==='string'&&p.name.trim()){
      for(const [k,max] of [['name',32],['family',36],['bio',160]])personal[k]=typeof p[k]==='string'?p[k].slice(0,max):'';
      if(typeof p.avatar==='string'&&/^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(p.avatar)&&p.avatar.length<350000)personal.avatar=p.avatar;
    }
    const d=JSON.parse(localStorage.getItem(progressKey)||'null');
    if(d&&Number.isSafeInteger(d.level)&&d.level>=1&&Number.isInteger(d.xp)&&d.xp>=0&&d.xp<100){
      Object.assign(state.user,{level:d.level,xp:d.xp});
      for(const k of ['gold','crystals'])if(Number.isSafeInteger(d[k])&&d[k]>=0)state.user[k]=d[k];
      if(Array.isArray(d.claims))state.claimedLevelRewards=d.claims.filter(l=>checkpoints.some(c=>c.lv===l));

function jewelImage(style,hue){
  const c=document.createElement('canvas');c.width=480;c.height=300;
  const ctx=c.getContext('2d'),gold='#efcf8a';
  const glow=ctx.createRadialGradient(240,124,4,240,150,260);
  glow.addColorStop(0,'hsl('+hue+' 45% 29%)');glow.addColorStop(1,'#080b17');
  ctx.fillStyle=glow;ctx.fillRect(0,0,480,300);
  ctx.strokeStyle='#eac78180';ctx.lineWidth=1;ctx.strokeRect(12.5,12.5,455,275);
  for(let i=0;i<32;i++){const x=25+(i*97)%431,y=24+(i*67)%246;ctx.fillStyle='rgba(255,229,186,'+(.2+(i%5)*.09)+')';ctx.beginPath();ctx.arc(x,y,1+i%2,0,Math.PI*2);ctx.fill();}
  ctx.translate(240,145);
  ctx.strokeStyle=gold;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,62,100,19,0,0,Math.PI*2);ctx.stroke();
  if(style==='pearl'){
    for(let i=0;i<23;i++){const a=Math.PI*i/22,x=Math.cos(a)*106,y=Math.sin(a)*58-25;
      const g=ctx.createRadialGradient(x-3,y-4,1,x,y,10);g.addColorStop(0,'#fff');g.addColorStop(.5,'#f4e1cf');g.addColorStop(1,'#866d99');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();}
  }
  const sides=style==='emerald'?8:style==='star'?10:style==='sapphire'?6:12,outer=[],inner=[];
  for(let i=0;i<sides;i++){const a=2*Math.PI*i/sides-Math.PI/2;
    const r=style==='star'&&i%2?.52:1;
    outer.push([Math.cos(a)*r*(style==='emerald'?56:73),Math.sin(a)*r*75]);
    inner.push([Math.cos(a+.12)*r*34-5,Math.sin(a+.12)*r*32-8]);}
  function facet(points,light,edge){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle='hsl('+hue+' 70% '+light+'%)';ctx.fill();ctx.strokeStyle=edge||'rgba(255,255,255,.32)';ctx.lineWidth=1;ctx.stroke();}
  if(style==='pearl'){
    const p=ctx.createRadialGradient(-14,-21,2,2,0,39);p.addColorStop(0,'#fff');p.addColorStop(.35,'#fff0dd');p.addColorStop(.67,'#cdbed9');p.addColorStop(1,'#77658a');
    ctx.fillStyle=p;ctx.beginPath();ctx.arc(0,0,39,0,Math.PI*2);ctx.fill();

    let _zegoSdkPromise = null;

    function loadZegoSdk() {
      if (window.ZegoUIKitPrebuilt) return Promise.resolve(window.ZegoUIKitPrebuilt);
      if (_zegoSdkPromise) return _zegoSdkPromise;
      _zegoSdkPromise = new Promise((resolve, reject) => {
        const sc = document.createElement('script');
        sc.src = 'https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js';
        sc.async = true;
        sc.onload = () => window.ZegoUIKitPrebuilt ? resolve(window.ZegoUIKitPrebuilt) : reject(new Error('تعذر تحميل مكتبة ZEGOCLOUD'));
        sc.onerror = () => reject(new Error('تعذر الاتصال بخادم مكتبة ZEGOCLOUD'));
        document.head.appendChild(sc);
      });
      return _zegoSdkPromise;
    }

    const ZEGO_APP_ID_KEY = 'halaa_zego_appid_custom';
    function getActiveZegoAppId() {
      const v = Number(localStorage.getItem(ZEGO_APP_ID_KEY));
      return v > 0 ? v : ZEGO_DEFAULT_APP_ID;
    }

    function openZegoConfigModal() {
      showToast('يتطلب الصوت المباشر إعداد خادم الصوت.');
    }

    async function connectZegoLive() {
      const room = state.activeRoom;
      if (!room) { showToast('ادخل إلى غرفة صوتية أولاً'); return; }
      const roomID = 'halaa_' + String(room.id || 'r1').replace(/[^a-zA-Z0-9_-]/g, '');
      const userID = getZegoDeviceUserId();
      const userName = state.user.name || 'عضو هلاا';
      const isHost = Boolean(state.user.isAdmin || room.discovery === 'my');

      showToast('جارٍ الاتصال بسيرفر ZEGOCLOUD الصوتي...');
      try {
        const ZegoUIKitPrebuilt = await loadZegoSdk();
        let kitToken = null;

        // 1) Try secure backend Token04 first (when hosted on server/app.mjs)
        try {
          const resp = await fetch('/api/zego-token', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ roomID, userID, userName })
          });
          if (resp.ok) {
            const data = await resp.json();
            if (data.token && data.appID) {
              kitToken = ZegoUIKitPrebuilt.generateKitTokenForProduction(data.appID, data.token, roomID, userID, userName);
            }
          }
        } catch (_) { /* Running standalone/offline without Node backend */ }

        if (!kitToken) {
          showToast('الصوت المباشر غير مفعّل لهذه النسخة.');
          return;
        }

        const overlay = document.getElementById('zegoLiveOverlay');
        const mount = document.getElementById('zegoMountRoot');
        const titleEl = document.getElementById('zegoRoomTitle');
        if (!overlay || !mount) return;

        disconnectZegoLive(true);
        overlay.classList.remove('hidden');
        if (titleEl) titleEl.textContent = 'بث مباشر: ' + room.title;

        const zp = ZegoUIKitPrebuilt.create(kitToken);
        _zegoInstance = zp;
        zp.joinRoom({
          container: mount,
          scenario: {
            mode: ZegoUIKitPrebuilt.LiveAudioRoom,
            config: {
              role: isHost ? ZegoUIKitPrebuilt.Host : ZegoUIKitPrebuilt.Audience,
              turnOnMicrophoneWhenJoining: isHost,
              seatConfig: {
                showSoundWaveInAudioMode: true
              }
            }
          },
          showPreJoinView: false,
          showLeavingView: false,
          onLeaveRoom: () => disconnectZegoLive(false)
        });
        showToast('تم الاتصال بغرفة ZEGOCLOUD الصوتية بنجاح 🎙️');
      } catch (err) {
        showToast(err?.message || 'تعذر الاتصال بسيرفر ZEGOCLOUD');
      }
    }

    function disconnectZegoLive(silent) {
      if (_zegoInstance) {
        try { _zegoInstance.destroy(); } catch (_) {}
        _zegoInstance = null;
      }
      const overlay = document.getElementById('zegoLiveOverlay');
      const mount = document.getElementById('zegoMountRoot');
      if (mount) mount.innerHTML = '';
      if (overlay) overlay.classList.add('hidden');
      if (!silent) showToast('تم إنهاء البث الصوتي المباشر');
    }

    // Route the room's Live button directly to ZEGOCLOUD Live Audio Room
    const _prevConnectLive = typeof connectLive === 'function' ? connectLive : null;
    connectLive = function() {
      return connectZegoLive();
    };
    const _prevStopLive = typeof stopLive === 'function' ? stopLive : null;
    stopLive = function() {
      disconnectZegoLive(true);
      if (_prevStopLive) _prevStopLive();
    };

  </script>
</body>
</html>
