<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e4fcf4"><title>هلاا | الألعاب والغرف</title><link rel="stylesheet" href="member.css"></head><body>
<main><header><button id="profile" aria-label="حسابي">هلاا</button><span id="identity"></span><button id="accountAction">دخول</button></header>
<section id="auth" hidden><a href="studio/">العودة</a><h1 id="formTitle"></h1><form><label id="nameLabel">اسم المستخدم<input name="nickname" autocomplete="username" maxlength="28"></label><label id="emailLabel">البريد الإلكتروني<input name="email" type="email" dir="ltr" autocomplete="email"></label><label id="passLabel">كلمة المرور<input name="password" type="password" dir="auto" autocomplete="current-password"></label><button class="primary" id="submit">متابعة</button></form><p id="status" role="status"></p><button id="alt"></button></section>
<section id="lobby" hidden><div id="games"><h2>الألعاب</h2><div class="grid gamegrid" dir="ltr"></div></div><section id="activities"><div class="row"><h2>نشاطات الغرف</h2><button id="more">كل الغرف ‹</button></div><div class="grid rooms"></div></section><section id="empty" hidden><h2></h2><p></p></section></section>
<nav hidden aria-label="التنقّل الرئيسي"></nav></main>
<dialog id="notice"><h2></h2><p></p><button class="primary" id="dismiss">حسنًا</button></dialog>
<dialog id="voice"><div class="row"><h2 id="voiceTitle"></h2><button id="leave">مغادرة</button></div><p id="voiceStatus" role="status"></p><div id="mount"></div></dialog>
<script src="member.js" defer></script></body></html>
