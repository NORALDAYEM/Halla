name: halaa_user_app
description: تطبيق هلاا للمستخدمين (غرف صوتية وألعاب جماعية) — Android / iOS / Web.
publish_to: 'none'
version: 3.1.4+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/halaa-clear.webp
    - assets/images/welcome-gallery/pool-friends.webp
    - assets/images/welcome-gallery/chessboard.webp
    - assets/images/welcome-gallery/ludo-friends.webp
    - assets/images/welcome-gallery/pool-table.webp
    - assets/images/welcome-gallery/game-table.webp
    - assets/images/welcome-gallery/chess-pieces.webp
    - assets/images/welcome-gallery/headphones.webp
